name: Semantic Activity Audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: semantic-activity-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python
        run: |
          python3 -m py_compile \
            database/activity_audit_repository.py \
            database/activity_audit_schema.py \
            database/event_consumer_schema.py \
            database/notification_outbox_repository.py \
            database/notification_outbox_schema.py \
            dashboard/activity_humanizer.py \
            dashboard/dashboard_activity_http.py \
            dashboard/alert_management_http.py \
            monitor/alert_engine.py \
            tests/database_audit_alerts_test.py

      - name: Validate JavaScript
        run: node --check dashboard/web/activity-log.js

      - name: Test semantic database audit and alerts
        run: python3 -m unittest -v tests.database_audit_alerts_test
