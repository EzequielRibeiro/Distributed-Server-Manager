name: Folia Catalog Runtime

on:
  pull_request:
    paths:
      - 'catalog/v2/games/minecraft/runtimes/java-folia.json'
      - 'catalog/v2/support-matrix.json'
      - 'installer/version_resolvers/papermc.sh'
      - 'tests/folia_catalog_runtime_test.sh'
      - 'tests/catalog_v2_test.sh'
      - '.github/workflows/folia-catalog-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'catalog/v2/games/minecraft/runtimes/java-folia.json'
      - 'catalog/v2/support-matrix.json'
      - 'installer/version_resolvers/papermc.sh'
      - 'tests/folia_catalog_runtime_test.sh'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runtime JSON
        run: jq -e . catalog/v2/games/minecraft/runtimes/java-folia.json >/dev/null
      - name: Validate resolver syntax
        run: bash -n installer/version_resolvers/papermc.sh tests/folia_catalog_runtime_test.sh
      - name: Test Folia/PaperMC resolver contract
        run: bash tests/folia_catalog_runtime_test.sh
      - name: Validate catalog completion
        run: python3 tests/catalog_completion_test.py
      - name: Validate canonical catalog
        run: bash tests/catalog_v2_test.sh
