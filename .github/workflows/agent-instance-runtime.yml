name: Agent Instance Runtime

on:
  pull_request:
    paths:
      - 'agents/linux/**'
      - 'database/agent_instance_runtime_repository.py'
      - 'database/agent_instance_provisioning_repository.py'
      - 'database/agent_instance_reconciliation_repository.py'
      - 'database/agent_instance_runtime_health_repository.py'
      - 'database/instance_storage_pool_migration_repository.py'
      - 'database/storage_pool_placement.py'
      - 'database/schemas/**'
      - 'dashboard/agent_admin_http.py'
      - 'dashboard/storage_pool_source_cleanup_http.py'
      - 'dashboard/web/agent-details.html'
      - 'dashboard/web/storage-pool-source-cleanup.js'
      - 'dashboard/agent_instance_runtime_*.py'
      - 'dashboard/agent_instance_provisioning_*.py'
      - 'dashboard/agent_heartbeat_api.py'
      - 'dashboard/agent_remote_http.py'
      - 'dashboard/server_part13.py'
      - 'dashboard/server_part17.py'
      - 'bin/cap'
      - 'release/build_agent_package.sh'
      - 'tests/agent_instance_state_access_test.py'
      - 'tests/agent_instance_state_systemd_e2e.sh'
      - 'tests/agent_systemd_materializer_regression_test.py'
      - 'tests/dayz_customer_file_isolation_test.py'
      - 'tests/dayz_namalsk_content_projection_test.py'
      - 'tests/dayz_keyring_mode_reconciliation_test.py'
      - 'tests/agent_instance_runtime_test.py'
      - 'tests/agent_instance_materialization_test.py'
      - 'tests/agent_game_runtime_profiles_test.py'
      - 'tests/agent_instance_provisioning_test.py'
      - 'tests/agent_runtime_reconciliation_test.py'
      - 'tests/agent_runtime_completion_test.py'
      - 'tests/agent_instance_storage_root_test.py'
      - 'tests/agent_storage_pools_test.py'
      - 'tests/agent_storage_pool_telemetry_test.py'
      - 'tests/agent_storage_pool_migration_test.py'
      - 'tests/storage_pool_source_cleanup_test.py'
      - 'tests/storage_pool_placement_test.py'
      - 'tests/storage_pool_migration_controller_test.py'
      - 'tests/storage_pool_source_cleanup_controller_test.py'
      - '.github/workflows/agent-instance-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'agents/linux/**'
      - 'database/agent_instance_runtime_repository.py'
      - 'database/agent_instance_provisioning_repository.py'
      - 'database/agent_instance_reconciliation_repository.py'
      - 'database/agent_instance_runtime_health_repository.py'
      - 'database/instance_storage_pool_migration_repository.py'
      - 'database/storage_pool_placement.py'
      - 'database/schemas/**'
      - 'dashboard/agent_admin_http.py'
      - 'dashboard/storage_pool_source_cleanup_http.py'
      - 'dashboard/web/agent-details.html'
      - 'dashboard/web/storage-pool-source-cleanup.js'
      - 'dashboard/agent_heartbeat_api.py'
      - 'dashboard/agent_instance_provisioning_*.py'
      - 'dashboard/server_part17.py'
      - 'release/build_agent_package.sh'
      - 'tests/agent_runtime_completion_test.py'
      - 'tests/agent_instance_storage_root_test.py'
      - 'tests/agent_storage_pools_test.py'
      - 'tests/agent_storage_pool_telemetry_test.py'
      - 'tests/agent_storage_pool_migration_test.py'
      - 'tests/storage_pool_source_cleanup_test.py'
      - 'tests/storage_pool_placement_test.py'
      - 'tests/storage_pool_migration_controller_test.py'
      - 'tests/storage_pool_source_cleanup_controller_test.py'
      - '.github/workflows/agent-instance-runtime.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate syntax
        run: |
          bash -n bin/cap
          bash -n agents/linux/installer/install-agent.sh
          bash -n release/build_agent_package.sh
          node --check dashboard/web/storage-pool-source-cleanup.js
          python3 -m py_compile agents/linux/runtime/*.py agents/linux/runtime/adapters/*.py agents/linux/runtime/materializers/*.py agents/linux/runtime/profiles/*.py agents/linux/privileged/materialize_instance.py agents/linux/privileged/reconcile_firewall.py agents/linux/updater/updater.py database/agent_instance_runtime_repository.py database/agent_instance_provisioning_repository.py database/agent_instance_reconciliation_repository.py database/agent_instance_runtime_health_repository.py database/instance_storage_pool_migration_repository.py database/storage_pool_placement.py dashboard/agent_admin_http.py dashboard/storage_pool_source_cleanup_http.py dashboard/agent_instance_runtime_api.py dashboard/agent_instance_runtime_http.py dashboard/agent_instance_provisioning_api.py dashboard/agent_instance_provisioning_http.py dashboard/agent_heartbeat_api.py dashboard/agent_remote_http.py dashboard/server_part13.py dashboard/server_part17.py tests/agent_instance_runtime_test.py tests/agent_instance_materialization_test.py tests/agent_game_runtime_profiles_test.py tests/agent_instance_provisioning_test.py tests/agent_runtime_reconciliation_test.py tests/agent_runtime_completion_test.py tests/agent_instance_storage_root_test.py tests/agent_storage_pools_test.py tests/agent_storage_pool_telemetry_test.py tests/agent_storage_pool_migration_test.py tests/storage_pool_source_cleanup_test.py tests/storage_pool_placement_test.py tests/storage_pool_migration_controller_test.py tests/storage_pool_source_cleanup_controller_test.py
      - name: Install test runner
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Verify Agent instance-root permissions in isolated fixtures
        run: |
          python3 -m pytest \
            tests/agent_instance_state_access_test.py \
            tests/agent_systemd_materializer_regression_test.py \
            -q

      - name: Exercise systemd instance-root repair on disposable CI service
        run: sudo --preserve-env=GITHUB_WORKSPACE bash tests/agent_instance_state_systemd_e2e.sh

      - name: Validate DayZ private root and virtual customer files
        run: python3 -m pytest tests/dayz_customer_file_isolation_test.py tests/dayz_namalsk_content_projection_test.py tests/dayz_keyring_mode_reconciliation_test.py -q

      - name: Validate conservative shared Workshop backup accounting
        run: python3 -m unittest tests/backup_storage_accounting_1066_test.py

      - name: Verify external backup restore permissions and rollback
        run: |
          python3 -m unittest tests/hybrid_privileged_backup_restore_test.py
          python3 -m unittest tests/backup_restore_rollback_safety_test.py

      - name: Verify failed backup retry guard and protected create dispatch
        run: |
          python3 -m unittest tests/backup_schedule_retry_guard_test.py
          python3 -m unittest tests/backup_client_instance_root_test.py
          python3 -m py_compile agents/linux/privileged/create_instance_backup.py agents/linux/privileged/restore_instance_backup.py agents/linux/runtime/backup_client.py database/backup_repository.py
      - name: Exercise protected backup creation and isolated restore with real systemd
        run: sudo --preserve-env=GITHUB_WORKSPACE bash tests/backup_privileged_create_systemd_e2e.sh
      - name: Validate physical backup inventory and customer deletion
        run: |
          python3 -m unittest tests/backup_storage_accounting_1066_test.py
          python3 -m unittest tests/customer_backup_physical_inventory_test.py
          python3 -m unittest tests/backup_archive_guards_test.py
          node --check dashboard/web/customer-instance-v2.js
          node --check dashboard/web/customer-backup-transfer.js

      - name: Run managed firewall lifecycle tests
        run: |
          python3 -m pytest             tests/linux_privileged_firewall_bridge_test.py             tests/linux_firewall_removal_lifecycle_test.py             tests/linux_managed_firewall_test.py             tests/hybrid_managed_firewall_substrate_test.py             tests/linux_updater_managed_firewall_state_test.py             tests/managed_firewall_port_uniqueness_test.py             -q

      - name: Run instance runtime tests
        run: |
          python3 -m unittest tests/agent_instance_runtime_test.py
          python3 -m unittest tests/agent_instance_materialization_test.py
          python3 -m unittest tests/agent_game_runtime_profiles_test.py
          python3 -m unittest tests/agent_instance_provisioning_test.py
          python3 -m unittest tests/agent_runtime_reconciliation_test.py
          python3 -m unittest tests/agent_runtime_completion_test.py
          python3 -m unittest tests/agent_instance_storage_root_test.py
          python3 -m unittest tests/agent_storage_pools_test.py
          python3 -m unittest tests/agent_storage_pool_telemetry_test.py
          python3 -m unittest tests/agent_storage_pool_migration_test.py
          python3 -m unittest tests/storage_pool_source_cleanup_test.py
          python3 -m unittest tests/storage_pool_placement_test.py
          python3 -m unittest tests/storage_pool_migration_controller_test.py
          python3 -m unittest tests/storage_pool_source_cleanup_controller_test.py
      - name: Check lifecycle policy boundary
        run: |
          grep -F 'capivara-instance-' agents/linux/policy/49-capivara-agent-instance-units.rules
          ! grep -F 'ssh.service' agents/linux/policy/49-capivara-agent-instance-units.rules
      - name: Check B8 materialization boundary
        run: |
          grep -F 'X-Capivara-GeneratedBy' agents/linux/runtime/materializers/systemd.py
          grep -F 'refusing to replace non-Capivara unit' agents/linux/runtime/materializers/systemd.py
          ! grep -F 'shell=True' agents/linux/runtime/runtime_spec.py agents/linux/runtime/runtime_materialization.py agents/linux/runtime/materializers/systemd.py
      - name: Check B9 profile boundary
        run: |
          grep -F 'class GameRuntimeProfile' agents/linux/runtime/profiles/base.py
          grep -F 'DayZRuntimeProfile' agents/linux/runtime/profiles/registry.py
          grep -F 'required reserved port is missing' agents/linux/runtime/profiles/base.py
          ! grep -Fi 'dayz' agents/linux/runtime/runtime_materialization.py agents/linux/runtime/materializers/systemd.py agents/linux/runtime/adapters/systemd.py
      - name: Check B10 provisioning boundary
        run: |
          grep -F 'CapivaraInstanceProvisioningRequest' agents/linux/runtime/provisioning_contract.py
          grep -F 'content_preserved_for_retry' agents/linux/runtime/provisioning_executor.py
          grep -F 'port_reservations_preserved' agents/linux/runtime/provisioning_executor.py
          grep -F 'capivara-agent-materialize@' agents/linux/policy/49-capivara-agent-instance-units.rules
          grep -F 'User=capivara-agent' agents/linux/services/capivara-agent.service
          ! grep -F 'User=root' agents/linux/services/capivara-agent.service
      - name: Check B11 recovery boundary
        run: |
          grep -F 'INSTANCE_DRIFT_DETECTED' agents/linux/runtime/runtime_reconciler.py
          grep -F 'INSTANCE_RECOVERED' agents/linux/runtime/runtime_reconciler.py
          grep -F 'ownership validation failed; automatic repair refused' agents/linux/runtime/runtime_reconciler.py
          ! grep -F 'shell=True' agents/linux/runtime/runtime_reconciler.py
      - name: Check B12 completion boundary
        run: |
          grep -F 'instance_lock' agents/linux/runtime/runtime_operations.py agents/linux/runtime/runtime_reconciler.py agents/linux/runtime/instance_runtime.py agents/linux/runtime/provisioning_executor.py
          grep -F 'recover_interrupted_operations' agents/linux/runtime/agent.py
          grep -F 'CapivaraInstanceRuntimeHealth' agents/linux/runtime/runtime_health.py
          grep -F 'provisioning_timeout_seconds' agents/linux/runtime/runtime_limits.py agents/linux/runtime/provisioning_executor.py
          grep -F 'instance_runtime_metrics' agents/linux/runtime/agent.py
          grep -F 'agent_instance_runtime_health' dashboard/agent_heartbeat_api.py database/agent_instance_runtime_health_repository.py
          test -f agents/linux/runtime/runtime_lock.py
          grep -F 'find "${PACKAGE_DIR}/agent/runtime"' agents/linux/installer/install-agent.sh
          grep -F 'git -C "${ROOT}" ls-tree -r --name-only "${REF}" -- agents/linux/runtime' release/build_agent_package.sh
          ! grep -F 'shell=True' agents/linux/runtime/runtime_lock.py agents/linux/runtime/runtime_operations.py agents/linux/runtime/runtime_health.py agents/linux/runtime/runtime_metrics.py agents/linux/runtime/runtime_limits.py
      - name: Check storage pool boundary
        run: |
          grep -F 'storage_pool_id' agents/linux/runtime/game_runtime.py agents/linux/runtime/runtime_spec.py
          grep -F 'resolve_storage_pool' agents/linux/privileged/materialize_instance.py
          test -f agents/linux/runtime/storage_pools.py
          grep -F 'find "${PACKAGE_DIR}/agent/runtime"' agents/linux/installer/install-agent.sh
          grep -F 'git -C "${ROOT}" ls-tree -r --name-only "${REF}" -- agents/linux/runtime' release/build_agent_package.sh
          grep -F '_storage_pool_samples' agents/linux/runtime/runtime_metrics.py
          grep -F 'usable_bytes' agents/linux/runtime/runtime_metrics.py
          grep -F 'telemetry["storage_pools"]' agents/linux/runtime/runtime_metrics.py
          grep -F 'select_storage_pool' database/storage_pool_placement.py database/agent_instance_provisioning_repository.py
          grep -F 'INSTANCE_STORAGE_POOL_SELECTED' database/agent_instance_provisioning_repository.py
          grep -F 'reserved_bytes_by_pool' database/storage_pool_placement.py database/agent_instance_provisioning_repository.py
          grep -F 'storage_reserved_bytes' agents/linux/runtime/provisioning_contract.py database/agent_instance_provisioning_repository.py
          grep -F 'INSTANCE_STORAGE_POOL_CAPACITY_RESERVED' database/agent_instance_provisioning_repository.py
          grep -F 'INSTANCE_STORAGE_POOL_CAPACITY_RELEASED' database/agent_instance_provisioning_repository.py
          grep -F 'target_storage_pool_id' agents/linux/runtime/storage_pool_migration_executor.py agents/linux/privileged/materialize_instance.py
          grep -F '.capivara-migrate-' agents/linux/privileged/materialize_instance.py
          grep -F 'atomic_commit' agents/linux/privileged/materialize_instance.py agents/linux/runtime/storage_pool_migration_executor.py
          grep -F 'INSTANCE_STORAGE_POOL_MIGRATION_COMPLETED' agents/linux/runtime/storage_pool_migration_executor.py database/instance_storage_pool_migration_repository.py
          grep -F 'INSTANCE_STORAGE_POOL_MIGRATION_REQUESTED' database/instance_storage_pool_migration_repository.py
          grep -F 'INSTANCE_STORAGE_POOL_MIGRATION_CAPACITY_RELEASED' database/instance_storage_pool_migration_repository.py
          grep -F 'storage_pool_migration_command' agents/linux/runtime/agent.py dashboard/agent_heartbeat_api.py
          grep -F 'storage_pool_migration_result' agents/linux/runtime/agent.py dashboard/agent_heartbeat_api.py
          grep -F '/api/admin/instance/storage-pool-migrate' dashboard/agent_admin_http.py
          test -f agents/linux/runtime/storage_pool_migration_executor.py
          grep -F 'cleanup-source' agents/linux/runtime/storage_pool_migration_executor.py database/instance_storage_pool_migration_repository.py
          grep -F 'INSTANCE_STORAGE_POOL_SOURCE_CLEANUP_REQUESTED' database/instance_storage_pool_migration_repository.py
          grep -F 'INSTANCE_STORAGE_POOL_SOURCE_CLEANUP_COMPLETED' agents/linux/runtime/storage_pool_migration_executor.py database/instance_storage_pool_migration_repository.py
          grep -F '/api/admin/instance/storage-pool-cleanup' dashboard/storage_pool_source_cleanup_http.py dashboard/web/storage-pool-source-cleanup.js
          ! grep -F 'source_path' dashboard/storage_pool_source_cleanup_http.py dashboard/web/storage-pool-source-cleanup.js
      - name: Check consolidated schema parity
        run: |
          set -euo pipefail
          for schema in sqlite postgresql mysql mariadb; do
            file="database/schemas/${schema}.sql"
            test -f "$file"
            for number in 027 028 029 030 031; do
              grep -E -- "-- source: ${number}_.+\\.sql" "$file"
            done
            grep -F 'agent_instance_runtime_health' "$file"
          done
      - name: Validate Agent package
        run: bash tests/agent_package_test.sh

  package_rc7_homologation:
    name: Build verified rc.7 artifact (no publication or deployment)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 1096 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'homolog/2.0.133-rc.6-dayz-isolation-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact RC candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert candidate identity and publication lock
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(cat version)" = '2.0.133-rc.7'
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('release/readiness-v2.json').read_text(encoding='utf-8'))
          assert r['release_version'] == '2.0.133-rc.7'
          assert r['tag_name'] == 'v2.0.133-rc.7'
          assert r['status'] == 'homologation-only'
          assert r['publish_release'] is False
          assert r['release_authorized'] is False
          assert Path('release/RELEASE_TRIGGER').read_text().splitlines()[0] != '2.0.133-rc.7'
          assert Path('release/RELEASE_NOTES_2.0.133-rc.7.md').is_file()
          PY

      - name: Run focused DayZ and Agent permission regression
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pytest -q \
            tests/dayz_customer_file_isolation_test.py \
            tests/agent_instance_state_access_test.py \
            tests/agent_systemd_materializer_regression_test.py \
            tests/dayz_management_test.py \
            tests/dayz_namalsk_content_projection_test.py \
            tests/dayz_keyring_mode_reconciliation_test.py

      - name: Build, inspect and checksum RC package in disposable runner
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/dsm-rc7-artifacts"
          mkdir -p "$ARTIFACT_DIR"
          bash release/build_release.sh "$EXPECTED_COMMIT" "$ARTIFACT_DIR"
          (
            cd "$ARTIFACT_DIR"
            sha256sum -c capivara-dsm-2.0.133-rc.7.tar.gz.sha256
          )
          python3 - "$ARTIFACT_DIR" "$EXPECTED_COMMIT" <<'PY'
          import hashlib
          import io
          import json
          from pathlib import Path
          import sys
          import tarfile

          base = Path(sys.argv[1])
          expected_commit = sys.argv[2]
          name = 'capivara-dsm-2.0.133-rc.7'
          archive = base / (name + '.tar.gz')
          manifest_path = base / (name + '.manifest.json')
          checksum_path = base / (name + '.tar.gz.sha256')
          assert archive.is_file() and manifest_path.is_file() and checksum_path.is_file()
          expected_hash, filename = checksum_path.read_text().strip().split()
          assert filename == archive.name
          actual_hash = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          assert actual_hash == expected_hash
          manifest = json.loads(manifest_path.read_text())
          assert manifest['kind'] == 'CapivaraReleaseManifest'
          assert manifest['version'] == '2.0.133-rc.7'
          assert manifest['git_commit'] == expected_commit
          assert manifest['archive'] == archive.name

          with tarfile.open(archive, 'r:gz') as tar:
              files = tar.getmembers()
              assert len([x for x in files if x.isfile()]) == manifest['file_count']
              for member in files:
                  assert member.name == name or member.name.startswith(name + '/'), member.name
                  assert '..' not in Path(member.name).parts
                  assert not member.issym() and not member.islnk()
              def member_bytes(path):
                  file = tar.extractfile(name + '/' + path)
                  assert file is not None, path
                  return file.read()
              assert member_bytes('version').decode().strip() == '2.0.133-rc.7'
              assert json.loads(member_bytes('release-manifest.json')) == manifest
              readiness = json.loads(member_bytes('release/readiness-v2.json'))
              assert readiness['publish_release'] is False
              assert readiness['release_authorized'] is False
              assert readiness['release_version'] == '2.0.133-rc.7'
              for path in (
                  'agents/linux/runtime/dayz_customer_files_policy.py',
                  'agents/linux/runtime/materializers/instance_state_access.py',
                  'agents/linux/runtime/instance_files_client.py',
                  'agents/linux/privileged/materialize_instance.py',
                  'agents/common/dayz_management.py',
                  'agents/linux/runtime/content_activation_dayz.py',
                  'agents/linux/privileged/create_instance_backup.py',
                  'tests/dayz_keyring_mode_reconciliation_test.py',
              ):
                  assert member_bytes(path)
          print('VERIFIED UNRELEASED RC7 SHA256:', actual_hash)
          print('VERIFIED GIT COMMIT:', expected_commit)
          PY

      - name: Upload temporary, unreleaseable RC package for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dsm-2.0.133-rc.7-unreleased-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/dsm-rc7-artifacts/*
          if-no-files-found: error
          retention-days: 7

  backup_create_systemd_rc7:
    name: Real systemd protected DayZ backup + restore (disposable)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 1096 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'homolog/2.0.133-rc.6-dayz-isolation-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert isolated disposable runner
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test -d /run/systemd/system
          test -n "$GITHUB_WORKSPACE"
          test ! -d /opt/dsm
          ! systemctl list-units --type=service --all --plain --no-legend 'capivara-instance-*.service' | grep -q '[^[:space:]]'
          test -d /etc/polkit-1/rules.d
      - name: Create real protected archive and restore safely in isolated systemd
        run: |
          set -euo pipefail
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash tests/backup_privileged_create_systemd_e2e.sh

  updater_disposable_rollback_rc7:
    name: Disposable real systemd updater success and failure rollback
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 1096 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'homolog/2.0.133-rc.6-dayz-isolation-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert disposable runner and absence of DSM deployment
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test -d /run/systemd/system
          test ! -d /opt/dsm
          ! systemctl list-units --type=service --all --plain --no-legend 'capivara-instance-*.service' | grep -q '[^[:space:]]'
      - name: Exercise real systemd PID preservation and updater rollback on fake files
        working-directory: tests
        run: |
          set -euo pipefail
          sudo env CAPIVARA_DSM928_SYSTEMD_E2E=1 python3 -m unittest \
            update_game_uptime_systemd_e2e_test.DisposableSystemdNoDrainTest.test_two_systemd_processes_survive_actual_updater_main_and_failure_rollback \
            update_game_uptime_systemd_e2e_test.DisposableSystemdNoDrainTest.test_two_real_systemd_processes_survive_actual_updater_file_functions
