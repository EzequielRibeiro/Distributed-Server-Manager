name: Agent Instance Runtime

on:
  pull_request:
    paths:
      - 'agents/linux/**'
      - 'database/agent_instance_runtime_repository.py'
      - 'database/agent_instance_provisioning_repository.py'
      - 'database/agent_instance_reconciliation_repository.py'
      - 'database/agent_instance_runtime_health_repository.py'
      - 'database/storage_pool_placement.py'
      - 'database/schemas/**'
      - 'dashboard/agent_instance_runtime_*.py'
      - 'dashboard/agent_instance_provisioning_*.py'
      - 'dashboard/agent_heartbeat_api.py'
      - 'dashboard/agent_remote_http.py'
      - 'dashboard/server_part13.py'
      - 'bin/cap'
      - 'release/build_agent_package.sh'
      - 'tests/agent_instance_runtime_test.py'
      - 'tests/agent_instance_materialization_test.py'
      - 'tests/agent_game_runtime_profiles_test.py'
      - 'tests/agent_instance_provisioning_test.py'
      - 'tests/agent_runtime_reconciliation_test.py'
      - 'tests/agent_runtime_completion_test.py'
      - 'tests/agent_instance_storage_root_test.py'
      - 'tests/agent_storage_pools_test.py'
      - 'tests/agent_storage_pool_telemetry_test.py'
      - 'tests/agent_storage_pool_migration_test.py'
      - 'tests/storage_pool_placement_test.py'
      - '.github/workflows/agent-instance-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'agents/linux/**'
      - 'database/agent_instance_runtime_repository.py'
      - 'database/agent_instance_provisioning_repository.py'
      - 'database/agent_instance_reconciliation_repository.py'
      - 'database/agent_instance_runtime_health_repository.py'
      - 'database/storage_pool_placement.py'
      - 'database/schemas/**'
      - 'dashboard/agent_heartbeat_api.py'
      - 'dashboard/agent_instance_provisioning_*.py'
      - 'release/build_agent_package.sh'
      - 'tests/agent_runtime_completion_test.py'
      - 'tests/agent_instance_storage_root_test.py'
      - 'tests/agent_storage_pools_test.py'
      - 'tests/agent_storage_pool_telemetry_test.py'
      - 'tests/agent_storage_pool_migration_test.py'
      - 'tests/storage_pool_placement_test.py'
      - '.github/workflows/agent-instance-runtime.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate syntax
        run: |
          bash -n bin/cap
          bash -n agents/linux/installer/install-agent.sh
          bash -n release/build_agent_package.sh
          python3 -m py_compile \
            agents/linux/runtime/*.py \
            agents/linux/runtime/adapters/*.py \
            agents/linux/runtime/materializers/*.py \
            agents/linux/runtime/profiles/*.py \
            agents/linux/privileged/materialize_instance.py \
            agents/linux/updater/updater.py \
            database/agent_instance_runtime_repository.py \
            database/agent_instance_provisioning_repository.py \
            database/agent_instance_reconciliation_repository.py \
            database/agent_instance_runtime_health_repository.py \
            database/storage_pool_placement.py \
            dashboard/agent_instance_runtime_api.py \
            dashboard/agent_instance_runtime_http.py \
            dashboard/agent_instance_provisioning_api.py \
            dashboard/agent_instance_provisioning_http.py \
            dashboard/agent_heartbeat_api.py \
            dashboard/agent_remote_http.py \
            dashboard/server_part13.py \
            tests/agent_instance_runtime_test.py \
            tests/agent_instance_materialization_test.py \
            tests/agent_game_runtime_profiles_test.py \
            tests/agent_instance_provisioning_test.py \
            tests/agent_runtime_reconciliation_test.py \
            tests/agent_runtime_completion_test.py \
            tests/agent_instance_storage_root_test.py \
            tests/agent_storage_pools_test.py \
            tests/agent_storage_pool_telemetry_test.py \
            tests/agent_storage_pool_migration_test.py \
            tests/storage_pool_placement_test.py
      - name: Run instance runtime tests
        run: |
          python3 -m unittest tests/agent_instance_runtime_test.py
          python3 -m unittest tests/agent_instance_materialization_test.py
          python3 -m unittest tests/agent_game_runtime_profiles_test.py
          python3 -m unittest tests/agent_instance_provisioning_test.py
          python3 -m unittest tests/agent_runtime_reconciliation_test.py
          python3 -m unittest tests/agent_runtime_completion_test.py
          python3 -m unittest tests/agent_instance_storage_root_test.py
          python3 -m unittest tests/agent_storage_pools_test.py
          python3 -m unittest tests/agent_storage_pool_telemetry_test.py
          python3 -m unittest tests/agent_storage_pool_migration_test.py
          python3 -m unittest tests/storage_pool_placement_test.py
      - name: Check lifecycle policy boundary
        run: |
          grep -F 'capivara-instance-' agents/linux/policy/49-capivara-agent-instance-units.rules
          ! grep -F 'ssh.service' agents/linux/policy/49-capivara-agent-instance-units.rules
      - name: Check B8 materialization boundary
        run: |
          grep -F 'X-Capivara-GeneratedBy' agents/linux/runtime/materializers/systemd.py
          grep -F 'refusing to replace non-Capivara unit' agents/linux/runtime/materializers/systemd.py
          ! grep -F 'shell=True' agents/linux/runtime/runtime_spec.py agents/linux/runtime/runtime_materialization.py agents/linux/runtime/materializers/systemd.py
      - name: Check B9 profile boundary
        run: |
          grep -F 'class GameRuntimeProfile' agents/linux/runtime/profiles/base.py
          grep -F 'DayZRuntimeProfile' agents/linux/runtime/profiles/registry.py
          grep -F 'required reserved port is missing' agents/linux/runtime/profiles/base.py
          ! grep -Fi 'dayz' agents/linux/runtime/runtime_materialization.py agents/linux/runtime/materializers/systemd.py agents/linux/runtime/adapters/systemd.py
      - name: Check B10 provisioning boundary
        run: |
          grep -F 'CapivaraInstanceProvisioningRequest' agents/linux/runtime/provisioning_contract.py
          grep -F 'content_preserved_for_retry' agents/linux/runtime/provisioning_executor.py
          grep -F 'port_reservations_preserved' agents/linux/runtime/provisioning_executor.py
          grep -F 'capivara-agent-materialize@' agents/linux/policy/49-capivara-agent-instance-units.rules
          grep -F 'User=capivara-agent' agents/linux/services/capivara-agent.service
          ! grep -F 'User=root' agents/linux/services/capivara-agent.service
      - name: Check B11 recovery boundary
        run: |
          grep -F 'INSTANCE_DRIFT_DETECTED' agents/linux/runtime/runtime_reconciler.py
          grep -F 'INSTANCE_RECOVERED' agents/linux/runtime/runtime_reconciler.py
          grep -F 'ownership validation failed; automatic repair refused' agents/linux/runtime/runtime_reconciler.py
          ! grep -F 'shell=True' agents/linux/runtime/runtime_reconciler.py
      - name: Check B12 completion boundary
        run: |
          grep -F 'instance_lock' agents/linux/runtime/runtime_operations.py agents/linux/runtime/runtime_reconciler.py agents/linux/runtime/instance_runtime.py agents/linux/runtime/provisioning_executor.py
          grep -F 'recover_interrupted_operations' agents/linux/runtime/agent.py
          grep -F 'CapivaraInstanceRuntimeHealth' agents/linux/runtime/runtime_health.py
          grep -F 'provisioning_timeout_seconds' agents/linux/runtime/runtime_limits.py agents/linux/runtime/provisioning_executor.py
          grep -F 'instance_runtime_metrics' agents/linux/runtime/agent.py
          grep -F 'agent_instance_runtime_health' dashboard/agent_heartbeat_api.py database/agent_instance_runtime_health_repository.py
          grep -F 'runtime_lock.py' agents/linux/installer/install-agent.sh release/build_agent_package.sh
          ! grep -F 'shell=True' agents/linux/runtime/runtime_lock.py agents/linux/runtime/runtime_operations.py agents/linux/runtime/runtime_health.py agents/linux/runtime/runtime_metrics.py agents/linux/runtime/runtime_limits.py
      - name: Check storage pool boundary
        run: |
          grep -F 'storage_pool_id' agents/linux/runtime/game_runtime.py agents/linux/runtime/runtime_spec.py
          grep -F 'resolve_storage_pool' agents/linux/privileged/materialize_instance.py
          grep -F 'storage_pools.py' agents/linux/installer/install-agent.sh release/build_agent_package.sh
          grep -F '_storage_pool_samples' agents/linux/runtime/runtime_metrics.py
          grep -F 'usable_bytes' agents/linux/runtime/runtime_metrics.py
          grep -F 'telemetry["storage_pools"]' agents/linux/runtime/runtime_metrics.py
          grep -F 'select_storage_pool' database/storage_pool_placement.py database/agent_instance_provisioning_repository.py
          grep -F 'INSTANCE_STORAGE_POOL_SELECTED' database/agent_instance_provisioning_repository.py
          grep -F 'reserved_bytes_by_pool' database/storage_pool_placement.py database/agent_instance_provisioning_repository.py
          grep -F 'storage_reserved_bytes' agents/linux/runtime/provisioning_contract.py database/agent_instance_provisioning_repository.py
          grep -F 'INSTANCE_STORAGE_POOL_CAPACITY_RESERVED' database/agent_instance_provisioning_repository.py
          grep -F 'INSTANCE_STORAGE_POOL_CAPACITY_RELEASED' database/agent_instance_provisioning_repository.py
          grep -F 'target_storage_pool_id' agents/linux/runtime/storage_pool_migration_executor.py agents/linux/privileged/materialize_instance.py
          grep -F '.capivara-migrate-' agents/linux/privileged/materialize_instance.py
          grep -F 'atomic_commit' agents/linux/privileged/materialize_instance.py agents/linux/runtime/storage_pool_migration_executor.py
          grep -F 'INSTANCE_STORAGE_POOL_MIGRATION_COMPLETED' agents/linux/runtime/storage_pool_migration_executor.py
          grep -F 'storage_pool_migration_executor.py' agents/linux/installer/install-agent.sh release/build_agent_package.sh
      - name: Check consolidated schema parity
        run: |
          set -euo pipefail
          for schema in sqlite postgresql mysql mariadb; do
            file="database/schemas/${schema}.sql"
            test -f "$file"
            for number in 027 028 029 030 031; do
              grep -E -- "-- source: ${number}_.+\\.sql" "$file"
            done
            grep -F 'agent_instance_runtime_health' "$file"
          done
      - name: Validate Agent package
        run: bash tests/agent_package_test.sh
