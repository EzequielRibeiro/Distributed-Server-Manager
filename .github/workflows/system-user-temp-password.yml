name: System User Temporary Passwords

on:
  pull_request:
    paths:
      - 'database/system_user_admin_repository.py'
      - 'dashboard/system_user_admin_api.py'
      - 'dashboard/server_part13.py'
      - 'dashboard/web/users.html'
      - 'dashboard/web/users.js'
      - 'dashboard/web/system-change-password.html'
      - 'dashboard/web/system-change-password.js'
      - 'tests/system_user_temporary_password_test.py'
      - '.github/workflows/system-user-temp-password.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python
        run: |
          python3 -m py_compile \
            database/system_user_admin_repository.py \
            dashboard/system_user_admin_api.py \
            dashboard/server_part13.py \
            tests/system_user_temporary_password_test.py
          python3 -m unittest tests/system_user_temporary_password_test.py
      - name: Validate JavaScript
        run: |
          node --check dashboard/web/users.js
          node --check dashboard/web/system-change-password.js
