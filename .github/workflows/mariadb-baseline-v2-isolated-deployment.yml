name: MariaDB Baseline v2 Isolated Deployment

on:
  pull_request:
    paths:
      - 'database/**'
      - 'dashboard/**'
      - 'tests/mysql_mariadb_baseline_v2_isolated_deployment_test.py'
      - '.github/workflows/mariadb-baseline-v2-isolated-deployment.yml'
      - 'release/readiness-v2.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: capivara_root_test_password
          MARIADB_DATABASE: capivara_mariadb_test
          MARIADB_USER: capivara_test
          MARIADB_PASSWORD: capivara_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      CAPIVARA_ALLOW_ISOLATED_DB_TEST: '1'
      CAPIVARA_EXPECTED_DB_FLAVOR: mariadb
      DSM_DATABASE_DRIVER: mariadb
      DSM_DATABASE_HOST: 127.0.0.1
      DSM_DATABASE_PORT: '3306'
      DSM_DATABASE_NAME: capivara_mariadb_test
      DSM_DATABASE_USER: capivara_test
      DSM_DATABASE_PASSWORD_FILE: /tmp/capivara-mariadb-test-password
      DSM_DATABASE_TLS: disable
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL/MariaDB Python driver
        run: python3 -m pip install 'mysql-connector-python>=9,<10'
      - name: Create protected password file
        run: |
          printf '%s\n' 'capivara_test_password' > /tmp/capivara-mariadb-test-password
          chmod 600 /tmp/capivara-mariadb-test-password
      - name: Compile isolated deployment test
        run: python3 -m py_compile tests/mysql_mariadb_baseline_v2_isolated_deployment_test.py
      - name: Run destructive isolated Baseline v2 bootstrap and upgrade replay
        run: python3 tests/mysql_mariadb_baseline_v2_isolated_deployment_test.py
