name: Next Dedicated Server Catalog Batch

on:
  pull_request:
    paths:
      - 'catalog/v2/games/**'
      - 'catalog/v2/support-matrix.json'
      - 'agents/linux/runtime/profiles/**'
      - 'agents/linux/runtime/*_prepare.py'
      - 'agents/windows/runtime/profiles/**'
      - 'agents/windows/runtime/runtime_spec.py'
      - 'agents/windows/runtime/runtime_materialization.py'
      - 'tests/next_games_catalog_test.py'
      - 'tests/catalog_completion_test.py'
      - 'tests/theisle_runtime_test.py'
      - '.github/workflows/next-games-catalog.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile typed Linux runtime modules
        run: |
          python3 -m py_compile agents/linux/runtime/profiles/catalog_native.py agents/linux/runtime/profiles/sevendaystodie.py agents/linux/runtime/profiles/factorio.py agents/linux/runtime/profiles/armareforger.py agents/linux/runtime/profiles/theisle.py agents/linux/runtime/sevendaystodie_prepare.py agents/linux/runtime/factorio_prepare.py agents/linux/runtime/armareforger_prepare.py agents/linux/runtime/theisle_prepare.py
      - name: Validate runtime manifests and support matrix JSON
        run: |
          python3 -m json.tool catalog/v2/support-matrix.json >/dev/null
          while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done < <(find catalog/v2/games -type f \( -path '*/runtimes/*.json' -o -path '*/deferred/*.json' \) -print0)
      - name: Run dedicated server batch regression
        run: python3 -m unittest tests/next_games_catalog_test.py tests/catalog_completion_test.py
      - name: Run The Isle secure runtime regression
        run: python3 tests/theisle_runtime_test.py
