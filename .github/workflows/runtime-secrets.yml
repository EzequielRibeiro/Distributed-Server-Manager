name: Runtime Secrets

on:
  pull_request:
    paths:
      - 'agents/linux/runtime/runtime_spec.py'
      - 'agents/linux/runtime/runtime_secret_store.py'
      - 'agents/linux/runtime/materializers/systemd.py'
      - 'tests/runtime_secret_store_test.py'
      - '.github/workflows/runtime-secrets.yml'
  push:
    branches: [main]
    paths:
      - 'agents/linux/runtime/runtime_spec.py'
      - 'agents/linux/runtime/runtime_secret_store.py'
      - 'agents/linux/runtime/materializers/systemd.py'
      - 'tests/runtime_secret_store_test.py'
      - '.github/workflows/runtime-secrets.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax
        run: |
          python3 -m py_compile \
            agents/linux/runtime/runtime_spec.py \
            agents/linux/runtime/runtime_secret_store.py \
            agents/linux/runtime/materializers/systemd.py \
            tests/runtime_secret_store_test.py
      - name: Run runtime secret tests
        run: python3 -m unittest tests/runtime_secret_store_test.py
      - name: Enforce no-plaintext contract
        run: |
          grep -F 'LoadCredential=' agents/linux/runtime/materializers/systemd.py
          grep -F 'secret_refs' agents/linux/runtime/runtime_spec.py
          grep -F 'CAPIVARA_RUNTIME_SECRET_ROOT' agents/linux/runtime/runtime_secret_store.py
          ! grep -F 'target":"environment"' agents/linux/runtime/runtime_spec.py
          ! grep -F 'shell=True' agents/linux/runtime/runtime_secret_store.py agents/linux/runtime/materializers/systemd.py
      - name: Validate dynamic Agent packaging
        run: |
          grep -F 'ls-tree -r --name-only "${REF}" -- agents/linux/runtime' release/build_agent_package.sh
          bash tests/agent_package_test.sh
