name: Palworld Runtime
on:
  pull_request:
    paths:
      - 'agents/linux/runtime/profiles/palworld.py'
      - 'agents/linux/runtime/profiles/registry.py'
      - 'catalog/v2/games/palworld/**'
      - 'catalog/v2/support-matrix.json'
      - 'tests/palworld_runtime_instance_isolation_test.py'
      - '.github/workflows/palworld-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'agents/linux/runtime/profiles/palworld.py'
      - 'agents/linux/runtime/profiles/registry.py'
      - 'catalog/v2/games/palworld/**'
      - 'catalog/v2/support-matrix.json'
      - 'tests/palworld_runtime_instance_isolation_test.py'
      - '.github/workflows/palworld-runtime.yml'
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax
        run: python3 -m py_compile agents/linux/runtime/profiles/palworld.py agents/linux/runtime/profiles/registry.py tests/palworld_runtime_instance_isolation_test.py
      - name: Prove Palworld isolation
        run: python3 -m unittest tests/palworld_runtime_instance_isolation_test.py
      - name: Enforce active catalog publication
        run: |
          test -f catalog/v2/games/palworld/runtimes/stable.json
          test ! -f catalog/v2/games/palworld/deferred/stable.json
          grep -F 'PalworldRuntimeProfile' agents/linux/runtime/profiles/registry.py
