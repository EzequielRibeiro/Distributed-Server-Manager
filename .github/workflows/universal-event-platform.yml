name: Universal Event Platform

on:
  pull_request:
    paths:
      - 'core/event_platform.py'
      - 'database/universal_event_repository.py'
      - 'database/universal_events_cli.py'
      - 'database/migrations/**'
      - 'database/migrations_mysql/**'
      - 'database/migrations_postgresql/**'
      - 'agents/linux/runtime/runtime_events.py'
      - 'agents/linux/runtime/agent.py'
      - 'dashboard/agent_heartbeat_api.py'
      - 'bin/cap'
      - 'tests/universal_event_platform_test.py'
      - '.github/workflows/universal-event-platform.yml'
  push:
    branches: [main]
    paths:
      - 'core/event_platform.py'
      - 'database/universal_event_repository.py'
      - 'database/universal_events_cli.py'
      - 'database/migrations/**'
      - 'database/migrations_mysql/**'
      - 'database/migrations_postgresql/**'
      - 'agents/linux/runtime/runtime_events.py'
      - 'agents/linux/runtime/agent.py'
      - 'dashboard/agent_heartbeat_api.py'
      - 'bin/cap'
      - 'tests/universal_event_platform_test.py'
      - '.github/workflows/universal-event-platform.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax
        run: |
          bash -n bin/cap
          python3 -m py_compile \
            core/event_platform.py \
            database/universal_event_repository.py \
            database/universal_events_cli.py \
            agents/linux/runtime/runtime_events.py \
            agents/linux/runtime/agent.py \
            dashboard/agent_heartbeat_api.py \
            tests/universal_event_platform_test.py
      - name: Validate migration parity
        run: |
          for directory in migrations migrations_mysql migrations_postgresql; do
            test -f "database/${directory}/032_universal_events.sql"
            grep -F 'CREATE TABLE universal_events' "database/${directory}/032_universal_events.sql"
            grep -F 'event_id' "database/${directory}/032_universal_events.sql"
            grep -F 'correlation_id' "database/${directory}/032_universal_events.sql"
          done
      - name: Run Universal Event Platform tests
        run: python3 -m unittest tests/universal_event_platform_test.py
      - name: Validate Agent package carries event transport
        run: |
          grep -F 'runtime_events.py' release/build_agent_package.sh
          grep -F 'read_runtime_events' agents/linux/runtime/agent.py
          grep -F 'acknowledge_runtime_events' agents/linux/runtime/agent.py
          grep -F 'accepted_event_ids' dashboard/agent_heartbeat_api.py
