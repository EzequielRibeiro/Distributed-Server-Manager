name: Universal Event Platform

on:
  pull_request:
    paths:
      - 'core/event_platform.py'
      - 'database/universal_event_repository.py'
      - 'database/universal_events_cli.py'
      - 'database/schemas/**'
      - 'database/schema_baseline.py'
      - 'agents/linux/runtime/runtime_events.py'
      - 'agents/linux/runtime/agent.py'
      - 'dashboard/agent_heartbeat_api.py'
      - 'dashboard/universal_event_api.py'
      - 'dashboard/universal_event_http.py'
      - 'dashboard/server_part13.py'
      - 'bin/cap'
      - 'tests/universal_event_platform_test.py'
      - '.github/workflows/universal-event-platform.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax
        run: |
          bash -n bin/cap
          python3 -m py_compile core/event_platform.py database/universal_event_repository.py database/universal_events_cli.py agents/linux/runtime/runtime_events.py agents/linux/runtime/agent.py dashboard/agent_heartbeat_api.py dashboard/universal_event_api.py dashboard/universal_event_http.py dashboard/server_part13.py tests/universal_event_platform_test.py tests/universal_event_http_test.py
      - name: Validate Database Baseline v2 parity
        run: |
          PYTHONPATH=database python3 - <<'PY'
          from schema_baseline import load_schema_baseline
          for backend in ("sqlite", "postgresql", "mysql", "mariadb"):
              sql = load_schema_baseline(backend).sql
              assert "CREATE TABLE universal_events" in sql
              assert "event_id" in sql
              assert "correlation_id" in sql
          PY
      - name: Run Universal Event Platform tests
        run: |
          python3 -m unittest tests/universal_event_platform_test.py
          python3 -m unittest tests/universal_event_http_test.py
      - name: Validate public contracts
        run: |
          grep -F 'cap events list' bin/cap
          grep -F 'EVENTS_PATH = "/api/events"' dashboard/universal_event_http.py
          test -f agents/linux/runtime/runtime_events.py
          grep -F 'git -C "${ROOT}" ls-tree -r --name-only "${REF}" -- agents/linux/runtime' release/build_agent_package.sh
          grep -F 'copy "${source}" "agent/runtime/${relative}"' release/build_agent_package.sh
          grep -F 'read_runtime_events' agents/linux/runtime/agent.py
          grep -F 'acknowledge_runtime_events' agents/linux/runtime/agent.py
          grep -F 'accepted_event_ids' dashboard/agent_heartbeat_api.py
