name: Publish Capivara 1.4.7 Maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.4.7-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout 1.4.7 maintenance branch
        uses: actions/checkout@v4
        with:
          ref: release/1.4.7-maintenance
          fetch-depth: 0

      - name: Verify isolated maintenance baseline
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < version)" = '1.4.7'
          git merge-base --is-ancestor v1.4.6 HEAD
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n release/build_release.sh
          bash -n update.sh
          bash -n install.sh

      - name: Build official DSM 1.4.7 assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          release/build_release.sh HEAD dist
          test -s dist/capivara-dsm-1.4.7.tar.gz
          test -s dist/capivara-dsm-1.4.7.tar.gz.sha256
          test -s dist/capivara-dsm-1.4.7.manifest.json
          (cd dist && sha256sum -c capivara-dsm-1.4.7.tar.gz.sha256)

      - name: Create v1.4.7 tag if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.meta.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin refs/tags/v1.4.7 >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/tags/v1.4.7' \
              -f sha="$TARGET_SHA"
          fi

      - name: Publish or repair GitHub Release 1.4.7
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.4.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.4.7 \
              dist/capivara-dsm-1.4.7.tar.gz \
              dist/capivara-dsm-1.4.7.tar.gz.sha256 \
              dist/capivara-dsm-1.4.7.manifest.json \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.4.7 \
              dist/capivara-dsm-1.4.7.tar.gz \
              dist/capivara-dsm-1.4.7.tar.gz.sha256 \
              dist/capivara-dsm-1.4.7.manifest.json \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title 'Capivara DSM v1.4.7' \
              --notes 'Maintenance release for the 1.4.x line, isolated from the Capivara DSM 2.0 main branch and built from the v1.4.6 stable baseline.'
          fi

      - name: Verify official updater asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.4.7 --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx 'capivara-dsm-1.4.7.tar.gz'
