name: Universal Configuration Platform

on:
  pull_request:
    paths:
      - 'core/configuration_platform.py'
      - 'database/configuration_repository.py'
      - 'database/configuration_cli.py'
      - 'database/schemas/**'
      - 'agents/linux/runtime/configuration_client.py'
      - 'agents/linux/runtime/agent.py'
      - 'dashboard/agent_heartbeat_api.py'
      - 'dashboard/configuration_api.py'
      - 'dashboard/configuration_http.py'
      - 'dashboard/server_part13.py'
      - 'release/build_agent_package.sh'
      - 'bin/cap'
      - 'tests/universal_configuration_platform_test.py'
      - 'tests/universal_configuration_http_test.py'
      - '.github/workflows/universal-configuration-platform.yml'
  push:
    branches: [main]
    paths:
      - 'core/configuration_platform.py'
      - 'database/configuration_repository.py'
      - 'database/configuration_cli.py'
      - 'database/schemas/**'
      - 'agents/linux/runtime/configuration_client.py'
      - 'agents/linux/runtime/agent.py'
      - 'dashboard/agent_heartbeat_api.py'
      - 'dashboard/configuration_api.py'
      - 'dashboard/configuration_http.py'
      - 'dashboard/server_part13.py'
      - 'release/build_agent_package.sh'
      - 'bin/cap'
      - 'tests/universal_configuration_platform_test.py'
      - 'tests/universal_configuration_http_test.py'
      - '.github/workflows/universal-configuration-platform.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax
        run: |
          bash -n bin/cap
          bash -n release/build_agent_package.sh
          python3 -m py_compile \
            core/configuration_platform.py \
            database/configuration_repository.py \
            database/configuration_cli.py \
            agents/linux/runtime/configuration_client.py \
            agents/linux/runtime/agent.py \
            dashboard/agent_heartbeat_api.py \
            dashboard/configuration_api.py \
            dashboard/configuration_http.py \
            dashboard/server_part13.py \
            tests/universal_configuration_platform_test.py \
            tests/universal_configuration_http_test.py
      - name: Validate consolidated schema parity
        run: |
          set -euo pipefail
          for schema in sqlite postgresql mysql mariadb; do
            file="database/schemas/${schema}.sql"
            test -f "$file"
            grep -F -- '-- source: 033_universal_configuration.sql' "$file"
            grep -F 'CREATE TABLE configurations' "$file"
            grep -F 'CREATE TABLE configuration_revisions' "$file"
            grep -F 'CREATE TABLE agent_configuration_state' "$file"
          done
      - name: Run Universal Configuration tests
        run: |
          python3 -m unittest tests/universal_configuration_platform_test.py
          python3 -m unittest tests/universal_configuration_http_test.py
      - name: Validate distribution contracts
        run: |
          grep -F 'cap config-store list' bin/cap
          grep -F 'CONFIGURATIONS_PATH = "/api/configurations"' dashboard/configuration_http.py
          grep -F 'configuration_commands' dashboard/agent_heartbeat_api.py
          grep -F 'configuration_state' agents/linux/runtime/agent.py
          test -f agents/linux/runtime/configuration_client.py
          grep -F 'ls-tree -r --name-only "${REF}" -- agents/linux/runtime' release/build_agent_package.sh
          grep -F 'copy "${source}" "agent/runtime/${relative}"' release/build_agent_package.sh
