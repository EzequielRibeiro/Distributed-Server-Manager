name: Rust Runtime
on:
  pull_request:
    paths:
      - 'agents/linux/runtime/profiles/rust.py'
      - 'agents/windows/runtime/profiles/rust.py'
      - 'agents/linux/runtime/profiles/registry.py'
      - 'agents/windows/runtime/profiles/registry.py'
      - 'catalog/v2/games/rust/**'
      - 'catalog/v2/support-matrix.json'
      - 'tests/rust_runtime_instance_isolation_test.py'
      - '.github/workflows/rust-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'agents/linux/runtime/profiles/rust.py'
      - 'agents/windows/runtime/profiles/rust.py'
      - 'agents/linux/runtime/profiles/registry.py'
      - 'agents/windows/runtime/profiles/registry.py'
      - 'catalog/v2/games/rust/**'
      - 'catalog/v2/support-matrix.json'
      - 'tests/rust_runtime_instance_isolation_test.py'
      - '.github/workflows/rust-runtime.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax
        run: python3 -m py_compile agents/linux/runtime/profiles/rust.py agents/windows/runtime/profiles/rust.py tests/rust_runtime_instance_isolation_test.py
      - name: Prove Rust cross-platform isolation
        run: python3 -m unittest tests/rust_runtime_instance_isolation_test.py
      - name: Enforce active catalog publication
        run: |
          test -f catalog/v2/games/rust/runtimes/stable.json
          test ! -f catalog/v2/games/rust/deferred/stable.json
          grep -F 'RustRuntimeProfile' agents/linux/runtime/profiles/registry.py
          grep -F 'RustRuntimeProfile' agents/windows/runtime/profiles/registry.py
