name: Issue 576 Release Fix Bootstrap

on:
  push:
    branches:
      - fix/baseline-v12-v13-release-upgrade
    paths:
      - tools/apply_issue_576_release_fix.py
      - .github/workflows/issue-576-release-fix-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/baseline-v12-v13-release-upgrade
          fetch-depth: 0
      - name: Apply, commit and validate release fix
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_issue_576_release_fix.py
          python3 tools/apply_issue_576_release_fix.py
          python3 -m py_compile database/baseline_upgrade_engine.py tests/update_baseline_upgrade_path_test.py
          bash -n release/build_release.sh update-manager/process-guard.sh
          python3 -m unittest tests/update_baseline_upgrade_path_test.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/baseline_upgrade_engine.py release/build_release.sh tests/update_baseline_upgrade_path_test.py
          git commit -m 'fix(update): reconcile Baseline v12-v13 release path'
          tmpdir="$(mktemp -d)"
          bash release/build_release.sh HEAD "$tmpdir"
          test -s "$tmpdir/capivara-dsm-$(cat version).tar.gz"
          git push origin HEAD:fix/baseline-v12-v13-release-upgrade
