name: Universal Server Update
on:
  pull_request:
    paths:
      - 'core/server_update_platform.py'
      - 'database/server_update_*'
      - 'database/agent_game_data_repository.py'
      - 'database/schema_baseline.py'
      - 'agents/linux/runtime/server_update_*'
      - 'agents/linux/runtime/game_data_executor.py'
      - 'dashboard/server_update_*'
      - 'dashboard/server_part18.py'
      - 'dashboard/web/server-updates.*'
      - 'systemd/dsm-dashboard.service'
      - 'release/build_agent_package.sh'
      - 'tests/universal_server_update_test.py'
      - '.github/workflows/universal-server-update.yml'
  push:
    branches: [main]
    paths:
      - 'core/server_update_platform.py'
      - 'database/server_update_*'
      - 'agents/linux/runtime/server_update_*'
      - 'dashboard/server_update_*'
      - 'dashboard/server_part18.py'
      - 'tests/universal_server_update_test.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax
        run: |
          python3 -m py_compile core/server_update_platform.py database/server_update_schema.py database/server_update_repository.py database/agent_game_data_repository.py agents/linux/runtime/server_update_provider.py agents/linux/runtime/server_update_transaction.py agents/linux/runtime/server_update_agent.py agents/linux/runtime/game_data_executor.py dashboard/server_update_api.py dashboard/server_update_http.py dashboard/server_update_install.py dashboard/server_part18.py tests/universal_server_update_test.py
      - name: Run Universal Server Update tests
        run: python3 -m unittest tests/universal_server_update_test.py
      - name: Validate dynamic Linux Agent packaging contract
        run: |
          bash -n release/build_agent_package.sh
          grep -F 'agents/linux/runtime' release/build_agent_package.sh
          grep -F 'find ' release/build_agent_package.sh
      - name: Enforce update security contract
        run: |
          ! grep -R -E 'shell=True|os\.system\(' core/server_update_platform.py database/server_update_repository.py agents/linux/runtime/server_update_*.py dashboard/server_update_*.py
          grep -F 'server_part18.py' systemd/dsm-dashboard.service
