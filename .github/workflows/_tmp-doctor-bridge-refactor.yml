name: Temporary Doctor bridge refactor

on:
  push:
    branches:
      - refactor/remove-doctor-dashboard-bridges
    paths:
      - .github/workflows/_tmp-doctor-bridge-refactor.yml

permissions:
  contents: write

jobs:
  patch-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal Dashboard server patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dashboard/server.py")
          text = path.read_text(encoding="utf-8")

          replacements = (
              ('    "doctor": STATE_DIR / "doctor_state.json",\n', ''),
              ('    "doctor": "doctor.sh",\n', ''),
              ('        "doctor": STATE.cached("doctor"),\n', ''),
              ('        if path == "/api/infrastructure":\n',
               '        if path.startswith("/api/infrastructure"):\n'),
          )

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one occurrence of {old!r}, found {count}"
                  )
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check -- dashboard/server.py

      - name: Commit source patch
        shell: bash
        run: |
          if git diff --quiet -- dashboard/server.py; then
            echo "No server.py changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/server.py
          git commit -m "Remove Doctor state bridge from Dashboard server"
          git push origin "HEAD:${GITHUB_REF_NAME}"
