name: Browser Session Security

on:
  pull_request:
    paths:
      - "dashboard/controller_session.py"
      - "dashboard/login_credentials.py"
      - "dashboard/browser_session_http.py"
      - "dashboard/server_part17.py"
      - "dashboard/web/**"
      - "tests/browser_session_security_test.py"
      - "tests/browser_auth_legacy_dependency_test.py"
      - ".github/workflows/browser-session.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/controller_session.py"
      - "dashboard/login_credentials.py"
      - "dashboard/browser_session_http.py"
      - "dashboard/server_part17.py"
      - "dashboard/web/**"
      - "tests/browser_session_security_test.py"
      - "tests/browser_auth_legacy_dependency_test.py"
      - ".github/workflows/browser-session.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python
        run: |
          python3 -m py_compile \
            dashboard/controller_session.py \
            dashboard/login_credentials.py \
            dashboard/browser_session_http.py \
            dashboard/server_part17.py \
            tests/browser_session_security_test.py \
            tests/browser_auth_legacy_dependency_test.py
      - name: Validate authenticated JavaScript
        run: |
          set -e
          for file in dashboard/web/*.js; do
            node --check "$file"
          done
      - name: Test browser session security
        run: |
          python3 -m unittest tests/browser_session_security_test.py
          python3 -m unittest tests/browser_auth_legacy_dependency_test.py
