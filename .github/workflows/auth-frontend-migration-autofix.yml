name: Browser Auth Frontend Migration Autofix

on:
  push:
    branches:
      - auth/web-session-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth/web-session-hardening
          fetch-depth: 0
      - name: Apply browser auth migration
        run: python3 tools/migrate_browser_auth_frontend.py || true
      - name: Commit migration results
        run: |
          if git diff --quiet -- dashboard/web; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/web
          git commit -m "Migrate remaining browser modules off legacy Basic auth"
          git push origin HEAD:auth/web-session-hardening
