name: Multi-Datacenter Federation

on:
  push:
    branches: [main, "feature/e1-multidatacenter-federation"]
  pull_request:

jobs:
  federation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate federation Python
        run: |
          python -m py_compile database/federation.py database/federation_repository.py database/federation_cli.py dashboard/federation_http.py dashboard/server_part13.py tests/test_multidatacenter_federation.py
      - name: Run federation contract and persistence tests
        run: python -m unittest tests.test_multidatacenter_federation -v
      - name: Validate cap CLI syntax and federation route
        run: |
          bash -n bin/cap
          grep -q 'federation)' bin/cap
          grep -q 'database/federation_cli.py' bin/cap
      - name: Verify active migration parity
        run: |
          test -f database/migrations/039_multidatacenter_federation.sql
          test -f database/migrations_postgresql/039_multidatacenter_federation.sql
          test -f database/migrations_mysql/039_multidatacenter_federation.sql
          for table in federation_controllers federation_credentials federation_request_nonces federation_snapshots federation_routes federation_event_cursors federation_event_receipts federation_handoffs; do
            grep -q "$table" database/migrations/039_multidatacenter_federation.sql
            grep -q "$table" database/migrations_postgresql/039_multidatacenter_federation.sql
            grep -q "$table" database/migrations_mysql/039_multidatacenter_federation.sql
          done
