name: Multi-Datacenter Federation

on:
  push:
    branches: [main, "feature/e1-multidatacenter-federation"]
  pull_request:

jobs:
  federation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile federation module
        run: python -m py_compile database/federation.py
      - name: Run federation contract tests
        run: python -m unittest tests.test_multidatacenter_federation -v
      - name: Verify migration parity
        run: |
          test -f database/migrations/sqlite/039_multidatacenter_federation.sql
          test -f database/migrations/postgresql/039_multidatacenter_federation.sql
          test -f database/migrations/mysql/039_multidatacenter_federation.sql
