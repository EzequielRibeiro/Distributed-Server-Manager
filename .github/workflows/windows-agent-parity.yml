name: Windows Agent Parity

on:
  pull_request:
    paths:
      - 'agents/windows/**'
      - 'database/instance_storage_pool_migration_repository.py'
      - 'database/storage_pool_placement.py'
      - 'dashboard/agent_heartbeat_api.py'
      - 'release/build_windows_agent_package.py'
      - 'tests/windows_agent_runtime_parity_test.py'
      - 'tests/windows_agent_storage_parity_test.py'
      - 'tests/phase19_windows_agent_test.py'
      - '.github/workflows/windows-agent-parity.yml'
  push:
    branches: [main]
    paths:
      - 'agents/windows/**'
      - 'database/instance_storage_pool_migration_repository.py'
      - 'database/storage_pool_placement.py'
      - 'dashboard/agent_heartbeat_api.py'
      - 'release/build_windows_agent_package.py'
      - 'tests/windows_agent_runtime_parity_test.py'
      - 'tests/windows_agent_storage_parity_test.py'
      - 'tests/phase19_windows_agent_test.py'
      - '.github/workflows/windows-agent-parity.yml'

permissions:
  contents: read

concurrency:
  group: windows-agent-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile complete Windows runtime
        run: python3 -m compileall -q agents/windows/runtime release/build_windows_agent_package.py tests/windows_agent_runtime_parity_test.py tests/windows_agent_storage_parity_test.py tests/phase19_windows_agent_test.py
      - name: Validate Windows runtime parity contracts
        run: |
          python3 -m unittest tests/windows_agent_runtime_parity_test.py
          python3 -m unittest tests/windows_agent_storage_parity_test.py
      - name: Validate Windows package and protocol
        run: python3 -m unittest tests/phase19_windows_agent_test.py
      - name: Check distributed Storage Pool boundary
        run: |
          set -euo pipefail
          grep -F 'storage_pool_id' agents/windows/runtime/game_runtime.py agents/windows/runtime/provisioning_executor.py agents/windows/runtime/instance_telemetry.py
          grep -F 'capivara.agent.storage' agents/windows/runtime/configuration_client.py
          grep -F 'pool_inventory' agents/windows/runtime/runtime_metrics.py
          grep -F 'queue_health' agents/windows/runtime/runtime_metrics.py
          grep -F 'storage_pool_migration_command' agents/windows/runtime/agent.py
          grep -F 'storage_pool_migration_result' agents/windows/runtime/agent.py
          grep -F 'INSTANCE_STORAGE_POOL_MIGRATION_COMPLETED' agents/windows/runtime/storage_pool_migration_executor.py
          grep -F 'INSTANCE_STORAGE_POOL_SOURCE_CLEANUP_COMPLETED' agents/windows/runtime/storage_pool_migration_executor.py
          grep -F '.capivara-migrate-' agents/windows/runtime/storage_pool_migration_executor.py
          grep -F 'sha256' agents/windows/runtime/storage_pool_migration_executor.py
          ! grep -F 'source_path' agents/windows/runtime/storage_pool_migration_executor.py agents/windows/runtime/storage_pool_migration_client.py
      - name: Build reproducible Windows Agent package
        run: |
          python3 release/build_windows_agent_package.py HEAD dist-parity
          test -s dist-parity/capivara-agent-windows-$(cat version).zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive=next(Path('dist-parity').glob('capivara-agent-windows-*.zip'))
          with zipfile.ZipFile(archive) as z:
              names=set(z.namelist())
          for filename in ('storage_pools.py','storage_pool_migration_state.py','storage_pool_migration_client.py','storage_pool_migration_executor.py','queue_observability.py'):
              assert any(name.endswith('/agent/runtime/'+filename) for name in names), filename
          PY

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile complete Windows runtime
        shell: pwsh
        run: python -m compileall -q agents/windows/runtime release/build_windows_agent_package.py tests/windows_agent_runtime_parity_test.py tests/windows_agent_storage_parity_test.py tests/phase19_windows_agent_test.py
      - name: Validate Windows runtime parity contracts natively
        shell: pwsh
        run: |
          python -m unittest tests/windows_agent_runtime_parity_test.py
          python -m unittest tests/windows_agent_storage_parity_test.py
      - name: Validate Windows package and protocol natively
        shell: pwsh
        run: python -m unittest tests/phase19_windows_agent_test.py
      - name: Build Windows package natively
        shell: pwsh
        run: python release/build_windows_agent_package.py HEAD dist-parity-win
