name: Minecraft Server Pack Customer Browser DOM E2E

on:
  pull_request:
    paths:
      - 'dashboard/web/customer-instance-v2.js'
      - 'dashboard/web/customer-instance.html'
      - 'tests/minecraft_serverpack_customer_browser_fixture.py'
      - 'tests/minecraft_serverpack_customer_real_browser_e2e.test.js'
      - 'tests/minecraft_serverpack_customer_session_readmodel_e2e_test.py'
      - '.github/workflows/minecraft-serverpack-customer-browser-dom-e2e.yml'

permissions:
  contents: read

jobs:
  customer-browser-disposable:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify disposable runner isolation and session fixture prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test ! -e /opt/dsm/runtime/hybrid-instance-storage
          python3 -m py_compile tests/minecraft_serverpack_customer_browser_fixture.py
          node --check tests/minecraft_serverpack_customer_real_browser_e2e.test.js
          node --check dashboard/web/customer-instance-v2.js
      - name: Install pinned Playwright and ephemeral Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-package-lock playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
      - name: Browser with real customer session and SQLite projection
        shell: bash
        env:
          CAPIVARA_RUN_1013_BROWSER_E2E: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsm-1013-browser"
          export DSM_ROOT="$RUNNER_TEMP/dsm-1013-browser"
          export DSM_1013_BROWSER_READY_FILE="$RUNNER_TEMP/dsm-1013-browser/ready.json"
          export DSM_1013_BROWSER_SCREENSHOT="$RUNNER_TEMP/dsm-1013-browser/customer-content-dom.png"
          python3 -u tests/minecraft_serverpack_customer_browser_fixture.py \
            "$DSM_1013_BROWSER_READY_FILE" \
            > "$RUNNER_TEMP/dsm-1013-browser/controller.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true; rm -f "$DSM_1013_BROWSER_READY_FILE"' EXIT
          for i in $(seq 1 120); do
            if test -s "$DSM_1013_BROWSER_READY_FILE"; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/dsm-1013-browser/controller.log"
              exit 1
            fi
            sleep 0.25
          done
          test -s "$DSM_1013_BROWSER_READY_FILE" || { cat "$RUNNER_TEMP/dsm-1013-browser/controller.log"; exit 1; }
          node tests/minecraft_serverpack_customer_real_browser_e2e.test.js
          grep -q 'DSM1013_BROWSER_FIXTURE_READY' "$RUNNER_TEMP/dsm-1013-browser/controller.log"
          test -s "$DSM_1013_BROWSER_SCREENSHOT"
      - name: Retain disposable DOM screenshot and fixture log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsm1013-customer-browser-evidence
          path: |
            ${{ runner.temp }}/dsm-1013-browser/customer-content-dom.png
            ${{ runner.temp }}/dsm-1013-browser/controller.log
          retention-days: 7
          if-no-files-found: ignore
