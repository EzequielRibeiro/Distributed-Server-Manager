name: Runtime HOME Isolation

on:
  pull_request:
    paths:
      - 'agents/linux/runtime/materializers/systemd.py'
      - 'agents/linux/runtime/profiles/catalog_native.py'
      - 'tests/runtime_home_storage_pool_isolation_test.py'
      - '.github/workflows/runtime-home-isolation.yml'
  push:
    branches: [main]
    paths:
      - 'agents/linux/runtime/materializers/systemd.py'
      - 'agents/linux/runtime/profiles/catalog_native.py'
      - 'tests/runtime_home_storage_pool_isolation_test.py'
      - '.github/workflows/runtime-home-isolation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax
        run: python3 -m py_compile agents/linux/runtime/materializers/systemd.py agents/linux/runtime/profiles/catalog_native.py tests/runtime_home_storage_pool_isolation_test.py
      - name: Validate HOME and XDG isolation
        run: python3 -m unittest tests/runtime_home_storage_pool_isolation_test.py
      - name: Enforce selected storage-root binding
        run: |
          grep -F 'instance_state_root' agents/linux/runtime/materializers/systemd.py
          grep -F 'BindPaths=' agents/linux/runtime/materializers/systemd.py
          grep -F 'XDG_CONFIG_HOME=' agents/linux/runtime/materializers/systemd.py
