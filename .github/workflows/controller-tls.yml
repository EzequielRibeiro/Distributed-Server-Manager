name: Controller TLS Transport

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'installer/web_transport.sh'
      - 'installer/controller_tls_lifecycle.py'
      - 'installer/dsm-controller-tls.*'
      - 'systemd/dsm-dashboard.service'
      - 'update.sh'
      - 'tests/update_dashboard_readiness_test.sh'
      - 'tests/controller_tls_lifecycle_test.py'
      - 'config/dsm.conf'
      - 'dashboard/tls_runtime.py'
      - 'dashboard/server_part17.py'
      - 'agents/linux/installer/install-agent.sh'
      - 'agents/windows/installer/install-agent.ps1'
      - 'tests/controller_tls_transport_test.py'
      - 'tests/controller_tls_accept_resilience_test.py'
      - '.github/workflows/controller-tls.yml'
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'installer/web_transport.sh'
      - 'installer/controller_tls_lifecycle.py'
      - 'installer/dsm-controller-tls.*'
      - 'systemd/dsm-dashboard.service'
      - 'update.sh'
      - 'tests/update_dashboard_readiness_test.sh'
      - 'tests/controller_tls_lifecycle_test.py'
      - 'config/dsm.conf'
      - 'dashboard/tls_runtime.py'
      - 'dashboard/server_part17.py'
      - 'agents/linux/installer/install-agent.sh'
      - 'agents/windows/installer/install-agent.ps1'
      - 'tests/controller_tls_transport_test.py'
      - 'tests/controller_tls_accept_resilience_test.py'
      - '.github/workflows/controller-tls.yml'

jobs:
  controller-tls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell and Python syntax
        shell: pwsh
        run: |
          bash -n install.sh
          bash -n installer/web_transport.sh
          bash -n update.sh
          bash -n tests/update_dashboard_readiness_test.sh
          bash -n agents/linux/installer/install-agent.sh
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('agents/windows/installer/install-agent.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          python3 -m py_compile dashboard/tls_runtime.py dashboard/server_part17.py installer/controller_tls_lifecycle.py tests/controller_tls_lifecycle_test.py tests/controller_tls_transport_test.py tests/controller_tls_accept_resilience_test.py
      - name: Run Controller TLS, rollback and updater readiness suites
        run: |
          sudo /usr/bin/python3 -m unittest discover -s tests -p 'controller_tls*test.py' -v
          bash tests/update_dashboard_readiness_test.sh
      - name: Enforce transport boundaries
        run: |
          grep -q 'select_web_transport' install.sh
          grep -q 'persist_web_transport_config' install.sh
          grep -q 'letsencrypt' installer/web_transport.sh
          grep -q 'selfsigned' installer/web_transport.sh
          grep -q 'DSM_PUBLIC_PORT' installer/web_transport.sh
          grep -q 'DSM_CONTROLLER_PUBLIC_URL' installer/web_transport.sh
          grep -q 'http-01' installer/web_transport.sh
          grep -q 'dns-01-manual' installer/web_transport.sh
          grep -q 'dns-01-hook' installer/web_transport.sh
          grep -q -- '--manual-auth-hook' installer/web_transport.sh
          grep -q -- '--manual-cleanup-hook' installer/web_transport.sh
          grep -q 'renewal-hooks/deploy/capivara-dashboard' installer/web_transport.sh
          grep -q -- '--controller-ca-file' agents/linux/installer/install-agent.sh
          grep -q 'update-ca-certificates' agents/linux/installer/install-agent.sh
          grep -q 'ControllerCaFile' agents/windows/installer/install-agent.ps1
          grep -q 'Import-Certificate' agents/windows/installer/install-agent.ps1
          grep -q 'run_dashboard' dashboard/server_part17.py
          grep -q 'TLSv1_2' dashboard/tls_runtime.py
          grep -q 'Strict-Transport-Security' dashboard/tls_runtime.py
