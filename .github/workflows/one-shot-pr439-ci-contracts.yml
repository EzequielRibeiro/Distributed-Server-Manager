name: One-shot PR439 CI contracts

on:
  push:
    branches:
      - cleanup/remove-remaining-compatibility

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message != 'test: align contracts with retired compatibility paths' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-remaining-compatibility
          fetch-depth: 0
      - name: Apply deterministic contract updates
        run: python3 tools/apply_pr439_ci_contracts.py
      - name: Validate targeted contracts
        run: |
          python3 -m py_compile dashboard/server.py tools/legacy_audit.py
          bash -n update.sh tests/update_dashboard_readiness_test.sh tests/update_manager_test.sh tests/cli_public_contract_test.sh
          bash tests/update_dashboard_readiness_test.sh
          bash tests/update_manager_test.sh
          bash tests/cli_public_contract_test.sh
          python3 tools/legacy_audit.py
      - name: Commit contract updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'test: align contracts with retired compatibility paths'
          git push origin HEAD:cleanup/remove-remaining-compatibility
