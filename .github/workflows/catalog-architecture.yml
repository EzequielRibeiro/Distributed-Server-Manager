name: Catalog Architecture

on:
  pull_request:
    paths:
      - 'dashboard/catalog_controller_runtime_policy.py'
      - 'dashboard/catalog_runtime_policy_http.py'
      - 'dashboard/catalog_provisioning_resolver.py'
      - 'dashboard/agent_instance_provisioning_api.py'
      - 'dashboard/server_part17.py'
      - 'dashboard/web/catalog*'
      - 'installer/catalog.sh'
      - 'installer/version_resolvers/forge_maven.sh'
      - 'installer/version_resolvers/neoforge_maven.sh'
      - 'agents/linux/runtime/catalog_runtime_policy.py'
      - 'agents/linux/runtime/game_data_*'
      - 'agents/windows/runtime/catalog_runtime_policy.py'
      - 'agents/windows/runtime/game_data_*'
      - 'database/agent_instance_provisioning_repository.py'
      - 'core/runtime_engine_contract.py'
      - 'core/installation_strategy.py'
      - 'catalog/v2/games/minecraft/runtimes/java-forge.json'
      - 'catalog/v2/games/minecraft/runtimes/java-neoforge.json'
      - 'catalog/v2/schemas/runtime-definition.schema.json'
      - 'catalog/v2/schemas/runtime-engine-contract.schema.json'
      - 'catalog/v2/schemas/installation-strategy.schema.json'
      - 'docs/architecture/runtime-engine-contract.md'
      - 'docs/architecture/installation-strategy.md'
      - 'release/build_agent_package.sh'
      - 'tests/catalog_architecture_stages_5_10_test.py'
      - 'tests/minecraft_installer_runtime_test.py'
      - 'tests/runtime_engine_contract_test.py'
      - 'tests/installation_strategy_test.py'
      - '.github/workflows/catalog-architecture.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Python
        run: |
          python3 -m py_compile \
            dashboard/catalog_controller_runtime_policy.py \
            dashboard/catalog_runtime_policy_http.py \
            dashboard/catalog_provisioning_resolver.py \
            dashboard/agent_instance_provisioning_api.py \
            dashboard/server_part17.py \
            agents/linux/runtime/catalog_runtime_policy.py \
            agents/linux/runtime/game_data_integrity.py \
            agents/linux/runtime/game_data_reconcile.py \
            agents/linux/runtime/game_data_executor.py \
            agents/linux/runtime/game_data_installer.py \
            agents/windows/runtime/catalog_runtime_policy.py \
            agents/windows/runtime/game_data_files.py \
            agents/windows/runtime/game_data_integrity.py \
            agents/windows/runtime/game_data_executor.py \
            agents/windows/runtime/game_data_installer.py \
            core/runtime_engine_contract.py \
            core/installation_strategy.py \
            tests/catalog_architecture_stages_5_10_test.py \
            tests/minecraft_installer_runtime_test.py \
            tests/runtime_engine_contract_test.py \
            tests/installation_strategy_test.py
      - name: Validate RuntimeDefinition schema JSON
        run: python3 -m json.tool catalog/v2/schemas/runtime-definition.schema.json >/dev/null
      - name: Validate canonical Runtime Engine schema JSON
        run: python3 -m json.tool catalog/v2/schemas/runtime-engine-contract.schema.json >/dev/null
      - name: Validate canonical Installation Strategy schema JSON
        run: python3 -m json.tool catalog/v2/schemas/installation-strategy.schema.json >/dev/null
      - name: Validate typed resolver Bash syntax
        run: bash -n installer/version_resolvers/forge_maven.sh installer/version_resolvers/neoforge_maven.sh installer/catalog.sh
      - name: Validate Dashboard JavaScript
        run: node --check dashboard/web/catalog-page.js
      - name: Test stages 5-10
        run: python3 -m unittest tests/catalog_architecture_stages_5_10_test.py
      - name: Test typed Minecraft installers
        run: python3 -m unittest tests/minecraft_installer_runtime_test.py
      - name: Test canonical Runtime Engine contract
        run: python3 -m unittest tests/runtime_engine_contract_test.py
      - name: Test canonical Installation Strategy
        run: python3 -m unittest tests/installation_strategy_test.py
      - name: Test Linux Agent package
        run: bash tests/agent_package_test.sh
      - name: Test Windows Agent package
        run: python3 -m unittest tests/phase19_windows_agent_test.py
