name: CLI Unification

on:
  pull_request:
    paths:
      - 'bin/cap'
      - 'bin/dsm'
      - 'bin/dsm-compat'
      - 'bin/dsm-runtime'
      - 'core/role_context.py'
      - 'core/user_manager.sh'
      - 'config/dsm.conf'
      - 'tests/cli_public_contract_test.sh'
      - 'tests/cli_unification_test.sh'
      - 'tests/cli_role_context_test.py'
      - 'tests/cli_role_enforcement_test.sh'
      - 'docs/architecture/cli-unification-v2.md'
      - 'docs/architecture/cli-unification.md'
      - 'docs/architecture/cli-role-enforcement.md'
      - '.github/workflows/cli-unification.yml'
  push:
    branches: [main]
    paths:
      - 'bin/cap'
      - 'bin/dsm'
      - 'bin/dsm-compat'
      - 'bin/dsm-runtime'
      - 'core/role_context.py'
      - 'core/user_manager.sh'
      - 'config/dsm.conf'
      - 'tests/cli_public_contract_test.sh'
      - 'tests/cli_unification_test.sh'
      - 'tests/cli_role_context_test.py'
      - 'tests/cli_role_enforcement_test.sh'
      - 'docs/architecture/cli-unification-v2.md'
      - 'docs/architecture/cli-unification.md'
      - 'docs/architecture/cli-role-enforcement.md'
      - '.github/workflows/cli-unification.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate syntax
        run: |
          bash -n bin/cap
          bash -n bin/dsm
          bash -n bin/dsm-compat
          bash -n bin/dsm-runtime
          bash -n tests/cli_public_contract_test.sh
          bash -n tests/cli_unification_test.sh
          bash -n tests/cli_role_enforcement_test.sh
          python3 -m py_compile core/role_context.py tests/cli_role_context_test.py

      - name: Test public CLI contract
        run: bash tests/cli_public_contract_test.sh

      - name: Test role resolver
        run: python3 -m unittest tests/cli_role_context_test.py

      - name: Test cap compatibility routing
        run: bash tests/cli_unification_test.sh

      - name: Test role enforcement
        run: bash tests/cli_role_enforcement_test.sh
