name: Published Release Smoke

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Canonical Capivara release tag to validate (for example v2.0.43)
        required: false
        type: string
  pull_request:
    paths:
      - 'release/build_release.sh'
      - 'release-manifest.json'
      - 'tests/release_build_test.sh'
      - 'tests/published_release_smoke_test.py'
      - '.github/workflows/published-release-smoke.yml'
      - 'docs/PUBLISHED_RELEASE_VALIDATION.md'

permissions:
  contents: read

concurrency:
  group: published-release-smoke-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout validation code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile published release validator
        run: python3 -m py_compile tests/published_release_smoke_test.py

      - name: Validate release builder contract on pull request
        if: github.event_name == 'pull_request'
        run: bash tests/release_build_test.sh

      - name: Resolve published release
        if: github.event_name != 'pull_request'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${REQUESTED_TAG:-}}"
          if [[ -z "${tag}" ]]; then
            tag="$(gh release list \
              --repo "${GITHUB_REPOSITORY}" \
              --exclude-drafts \
              --exclude-pre-releases \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName')"
          fi
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || {
            echo "Resolved tag is not a canonical Capivara SemVer tag: ${tag}" >&2
            exit 1
          }
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "Validating published release ${tag}"

      - name: Validate public GitHub release assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tests/published_release_smoke_test.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${{ steps.release.outputs.tag }}"
