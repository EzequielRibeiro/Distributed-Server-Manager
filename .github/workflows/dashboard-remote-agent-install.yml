name: Dashboard Remote Agent Install

on:
  pull_request:
    paths:
      - 'dashboard/agent_connection_api.py'
      - 'dashboard/agent_installation_api.py'
      - 'dashboard/agent_installation_http.py'
      - 'dashboard/web/add-agent.html'
      - 'dashboard/web/add-agent-linux.html'
      - 'dashboard/web/add-agent-windows.html'
      - 'dashboard/web/add-agent-v3.css'
      - 'dashboard/web/agent-installation.js'
      - 'dashboard/web/agent-installation-wizard.js'
      - 'dashboard/web/agent-installation-remote-check.js'
      - 'database/agent_installation_preconfiguration.py'
      - 'core/agent_ssh_deploy.py'
      - 'core/windows_agent_ssh_deploy.py'
      - 'tests/dashboard_remote_agent_install_test.py'
      - 'tests/agent_installation_wizard_steps_test.py'
      - 'tests/agent_connection_controller_probe_test.py'
      - 'tests/agent_ssh_cross_platform_test.py'
      - 'docs/architecture/dashboard-remote-agent-install.md'
      - '.github/workflows/dashboard-remote-agent-install.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard/agent_connection_api.py'
      - 'dashboard/agent_installation_api.py'
      - 'dashboard/agent_installation_http.py'
      - 'dashboard/web/add-agent.html'
      - 'dashboard/web/add-agent-linux.html'
      - 'dashboard/web/add-agent-windows.html'
      - 'dashboard/web/add-agent-v3.css'
      - 'dashboard/web/agent-installation.js'
      - 'dashboard/web/agent-installation-wizard.js'
      - 'dashboard/web/agent-installation-remote-check.js'
      - 'database/agent_installation_preconfiguration.py'
      - 'core/agent_ssh_deploy.py'
      - 'core/windows_agent_ssh_deploy.py'
      - 'tests/dashboard_remote_agent_install_test.py'
      - 'tests/agent_installation_wizard_steps_test.py'
      - 'tests/agent_connection_controller_probe_test.py'
      - 'tests/agent_ssh_cross_platform_test.py'
      - '.github/workflows/dashboard-remote-agent-install.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python3 -m py_compile \
            dashboard/agent_connection_api.py \
            dashboard/agent_installation_api.py \
            dashboard/agent_installation_http.py \
            database/agent_installation_preconfiguration.py \
            database/agent_connection_test_cli.py \
            database/agent_remote_secret_cli.py \
            core/agent_ssh_deploy.py \
            core/windows_agent_ssh_deploy.py \
            tests/dashboard_remote_agent_install_test.py \
            tests/agent_installation_wizard_steps_test.py \
            tests/agent_connection_controller_probe_test.py \
            tests/agent_ssh_cross_platform_test.py

      - name: Validate Dashboard JavaScript
        run: |
          node --check dashboard/web/agent-installation.js
          node --check dashboard/web/agent-installation-wizard.js
          node --check dashboard/web/agent-installation-remote-check.js

      - name: Test remote install and preconfiguration contracts
        run: python3 -m unittest tests/dashboard_remote_agent_install_test.py

      - name: Test multi-step Agent wizard
        run: python3 -m unittest tests/agent_installation_wizard_steps_test.py

      - name: Test Agent to Controller reachability probe
        run: python3 -m unittest tests/agent_connection_controller_probe_test.py

      - name: Test cross-platform SSH contracts
        run: python3 -m unittest tests/agent_ssh_cross_platform_test.py

      - name: Security contract
        run: |
          ! grep -R --line-number 'type="password"' dashboard/web/add-agent*.html
          ! grep -R --line-number 'StrictHostKeyChecking=no' dashboard/agent_connection_api.py dashboard/agent_installation_api.py core/agent_ssh_deploy.py core/windows_agent_ssh_deploy.py
          ! grep -R --line-number 'shell=True' dashboard/agent_connection_api.py dashboard/agent_installation_api.py core/agent_ssh_deploy.py core/windows_agent_ssh_deploy.py
          ! grep -R --line-number -- '--password ' database/agent_deploy_cli.py database/agent_connection_test_cli.py bin/cap
