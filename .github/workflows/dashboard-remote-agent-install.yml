name: Dashboard Remote Agent Install

on:
  pull_request:
    paths:
      - 'dashboard/agent_installation_api.py'
      - 'dashboard/web/agents.html'
      - 'dashboard/web/agent-installation.js'
      - 'database/agent_installation_preconfiguration.py'
      - 'database/migrations/026_agent_installation_preconfiguration.sql'
      - 'core/agent_ssh_deploy.py'
      - 'tests/dashboard_remote_agent_install_test.py'
      - 'docs/architecture/dashboard-remote-agent-install.md'
      - '.github/workflows/dashboard-remote-agent-install.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard/agent_installation_api.py'
      - 'dashboard/web/agents.html'
      - 'dashboard/web/agent-installation.js'
      - 'database/agent_installation_preconfiguration.py'
      - 'database/migrations/026_agent_installation_preconfiguration.sql'
      - 'core/agent_ssh_deploy.py'
      - 'tests/dashboard_remote_agent_install_test.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python3 -m py_compile \
            dashboard/agent_installation_api.py \
            database/agent_installation_preconfiguration.py \
            core/agent_ssh_deploy.py \
            tests/dashboard_remote_agent_install_test.py

      - name: Validate Dashboard JavaScript
        run: node --check dashboard/web/agent-installation.js

      - name: Test remote install and preconfiguration contracts
        run: python3 -m unittest tests/dashboard_remote_agent_install_test.py

      - name: Security contract
        run: |
          ! grep -R --line-number 'type="password"' dashboard/web/agents.html
          ! grep -R --line-number 'StrictHostKeyChecking=no' dashboard/agent_installation_api.py core/agent_ssh_deploy.py
          ! grep -R --line-number 'shell=True' dashboard/agent_installation_api.py core/agent_ssh_deploy.py
