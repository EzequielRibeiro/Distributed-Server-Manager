name: Apply lifecycle HTTP 409 patch

on:
  push:
    branches:
      - fix/instance-lifecycle-command-arbitration-clean
    paths:
      - '.github/workflows/_apply-instance-lifecycle-http409.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instance-lifecycle-command-arbitration-clean
      - name: Apply focused HTTP 409 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server = Path('dashboard/server.py')
          source = server.read_text(encoding='utf-8')
          old = '''                success, result = control_instance(user, instance, action)\n                self.send_json(200 if success else 422, result)\n'''
          new = '''                success, result = control_instance(user, instance, action)\n                status = 200 if success else (\n                    409\n                    if isinstance(result, dict)\n                    and result.get("error") == "lifecycle_operation_in_progress"\n                    else 422\n                )\n                self.send_json(status, result)\n'''
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one lifecycle route block, found {source.count(old)}')
          server.write_text(source.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/instance_lifecycle_http_conflict_test.py')
          test.write_text('''#!/usr/bin/env python3\nfrom __future__ import annotations\n\nimport unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nSERVER = ROOT / "dashboard" / "server.py"\n\n\nclass InstanceLifecycleHttpConflictTest(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        cls.source = SERVER.read_text(encoding="utf-8")\n\n    def test_lifecycle_conflict_maps_to_http_409(self):\n        marker = 'success, result = control_instance(user, instance, action)'\n        block = self.source.split(marker, 1)[1].split('return', 1)[0]\n        self.assertIn('result.get("error") == "lifecycle_operation_in_progress"', block)\n        self.assertIn('409', block)\n        self.assertIn('else 422', block)\n        self.assertIn('self.send_json(status, result)', block)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          Path('.github/workflows/_apply-instance-lifecycle-http409.yml').unlink()
          PY
      - name: Commit focused patch
        shell: bash
        run: |
          git config user.name 'Ezequiel Alécio Ribeiro'
          git config user.email 'ezequiel.ribeiro@gmail.com'
          git add dashboard/server.py tests/instance_lifecycle_http_conflict_test.py .github/workflows/_apply-instance-lifecycle-http409.yml
          git commit -m 'fix(http): return 409 for active lifecycle conflicts'
          git push origin HEAD:fix/instance-lifecycle-command-arbitration-clean
