name: Maintenance Restart Framework
on:
  pull_request:
    paths:
      - 'core/maintenance_platform.py'
      - 'database/maintenance_schema.py'
      - 'database/maintenance_repository.py'
      - 'database/schema_baseline.py'
      - 'dashboard/workers/maintenance_worker.py'
      - 'dashboard/workers/worker.sh'
      - 'tests/maintenance_restart_framework_test.py'
      - '.github/workflows/maintenance-restart.yml'
  push:
    branches: [main]
    paths:
      - 'core/maintenance_platform.py'
      - 'database/maintenance_schema.py'
      - 'database/maintenance_repository.py'
      - 'database/schema_baseline.py'
      - 'dashboard/workers/maintenance_worker.py'
      - 'dashboard/workers/worker.sh'
      - 'tests/maintenance_restart_framework_test.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax
        run: |
          python3 -m py_compile core/maintenance_platform.py database/maintenance_schema.py database/maintenance_repository.py database/schema_baseline.py dashboard/workers/maintenance_worker.py tests/maintenance_restart_framework_test.py
          bash -n dashboard/workers/worker.sh
      - name: Run M5 framework tests
        run: python3 -m unittest tests/maintenance_restart_framework_test.py
      - name: Validate integration wiring
        run: |
          grep -F 'start_python_worker maintenance_worker.py' dashboard/workers/worker.sh
          grep -F 'ensure_maintenance_schema' database/schema_baseline.py
          grep -F "action='restart'" dashboard/workers/maintenance_worker.py
          grep -F "action='doctor'" dashboard/workers/maintenance_worker.py
