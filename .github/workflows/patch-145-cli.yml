name: Apply 1.4.5 CLI contract patch

on:
  push:
    branches:
      - fix/1.4.5-cli-and-scheduler

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1.4.5-cli-and-scheduler
          fetch-depth: 0

      - name: Patch install and update contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # install.sh: model dsm and cap as equal public CLIs.
          replace_once(
              'install.sh',
              'DSM_BIN="${DSM_ROOT}/bin/dsm"\nDSM_LINK="${DSM_LINK:-/usr/local/bin/dsm}"\n',
              'DSM_BIN="${DSM_ROOT}/bin/dsm"\nCAP_BIN="${DSM_ROOT}/bin/cap"\nDSM_LINK="${DSM_LINK:-/usr/local/bin/dsm}"\nCAP_LINK="${CAP_LINK:-/usr/local/bin/cap}"\n',
          )
          replace_once(
              'install.sh',
              '        && [[ -f "${INSTALLER_DIR}/bin/dsm" ]] \\\n        && [[ -f "${INSTALLER_DIR}/core/bootstrap.sh" ]] \\\n',
              '        && [[ -f "${INSTALLER_DIR}/bin/dsm" ]] \\\n        && [[ -f "${INSTALLER_DIR}/bin/cap" ]] \\\n        && [[ -f "${INSTALLER_DIR}/core/bootstrap.sh" ]] \\\n',
          )
          replace_once(
              'install.sh',
              '        version\n        bin/dsm\n        core/bootstrap.sh\n',
              '        version\n        bin/dsm\n        bin/cap\n        core/bootstrap.sh\n',
          )
          replace_once(
              'install.sh',
              '    chmod +x "${DSM_BIN}"\n',
              '    chmod +x "${DSM_BIN}" "${CAP_BIN}"\n',
          )
          replace_once(
              'install.sh',
              '''install_cli()
{
    run mkdir -p "$(dirname "${DSM_LINK}")"
    run ln -sf \\
        "${DSM_BIN}" \\
        "${DSM_LINK}"

    (( DRY_RUN )) \\
        || chmod +x "${DSM_LINK}"
}
''',
              '''install_cli()
{
    run mkdir -p \\
        "$(dirname "${DSM_LINK}")" \\
        "$(dirname "${CAP_LINK}")"

    run ln -sf \\
        "${DSM_BIN}" \\
        "${DSM_LINK}"

    run ln -sf \\
        "${CAP_BIN}" \\
        "${CAP_LINK}"

    (( DRY_RUN )) \\
        || chmod +x "${DSM_LINK}" "${CAP_LINK}"
}
''',
          )
          replace_once(
              'install.sh',
              '    [[ -x "${DSM_BIN}" ]] \\\n        || die "CLI ausente: ${DSM_BIN}"\n',
              '    [[ -x "${DSM_BIN}" ]] \\\n        || die "CLI ausente: ${DSM_BIN}"\n\n    [[ -x "${CAP_BIN}" ]] \\\n        || die "CLI ausente: ${CAP_BIN}"\n',
          )
          replace_once(
              'install.sh',
              '    printf \'Comando           : %s\\n\' "${DSM_LINK}"\n',
              '    printf \'Comando DSM       : %s\\n\' "${DSM_LINK}"\n    printf \'Comando Capivara  : %s\\n\' "${CAP_LINK}"\n',
          )

          # update.sh: validate, permission, publish and final-check both CLIs.
          replace_once(
              'update.sh',
              'BIN_LINK="/usr/local/bin/dsm"\n',
              'DSM_BIN_LINK="/usr/local/bin/dsm"\nCAP_BIN_LINK="/usr/local/bin/cap"\n',
          )
          replace_once(
              'update.sh',
              '        "version"\n        "bin/dsm"\n        "core/bootstrap.sh"\n',
              '        "version"\n        "bin/dsm"\n        "bin/cap"\n        "core/bootstrap.sh"\n',
          )
          replace_once(
              'update.sh',
              '        "bin/dsm"\n        "core/bootstrap.sh"\n',
              '        "bin/dsm"\n        "bin/cap"\n        "core/bootstrap.sh"\n',
          )
          replace_once(
              'update.sh',
              '    chmod +x "${INSTALL_DIR}/bin/dsm"\n',
              '    chmod +x "${INSTALL_DIR}/bin/dsm" "${INSTALL_DIR}/bin/cap"\n',
          )
          replace_once(
              'update.sh',
              '''# =============================================================
# Criar link global DSM | Create global DSM link
# =============================================================
install_command() {
    echo
    echo "Atualizando comando global..."
    echo "Updating global command..."
    ln -sf "${INSTALL_DIR}/bin/dsm" "${BIN_LINK}"
    chmod +x "${BIN_LINK}"
    echo
    echo "Comando DSM atualizado."
    echo "DSM command updated."
}
''',
              '''# =============================================================
# Criar links globais | Create global CLI links
# =============================================================
install_command() {
    echo
    echo "Atualizando comandos globais..."
    echo "Updating global commands..."

    ln -sf "${INSTALL_DIR}/bin/dsm" "${DSM_BIN_LINK}"
    ln -sf "${INSTALL_DIR}/bin/cap" "${CAP_BIN_LINK}"
    chmod +x "${DSM_BIN_LINK}" "${CAP_BIN_LINK}"

    echo
    echo "Comandos DSM e Capivara atualizados."
    echo "DSM and Capivara commands updated."
}
''',
          )
          replace_once(
              'update.sh',
              '        "${INSTALL_DIR}/bin/dsm"\n        "${INSTALL_DIR}/core/bootstrap.sh"\n',
              '        "${INSTALL_DIR}/bin/dsm"\n        "${INSTALL_DIR}/bin/cap"\n        "${INSTALL_DIR}/core/bootstrap.sh"\n',
          )

          # Existing tests should also assert the new contract directly.
          replace_once(
              'tests/install_manager_test.sh',
              'CLI="${ROOT}/bin/dsm"\n',
              'CLI="${ROOT}/bin/dsm"\nCAP_CLI="${ROOT}/bin/cap"\n',
          )
          replace_once(
              'tests/install_manager_test.sh',
              'grep -Fq \'run mkdir -p "$(dirname "${DSM_LINK}")"\' "${INSTALLER}" || fail "installer does not create custom CLI link parent"\n',
              'grep -Fq \'CAP_BIN="${DSM_ROOT}/bin/cap"\' "${INSTALLER}" || fail "installer does not model cap CLI"\ngrep -Fq \'CAP_LINK="${CAP_LINK:-/usr/local/bin/cap}"\' "${INSTALLER}" || fail "installer does not define cap global link"\ngrep -Fq \'"$(dirname "${CAP_LINK}")"\' "${INSTALLER}" || fail "installer does not create cap CLI link parent"\n',
          )
          replace_once(
              'tests/update_manager_test.sh',
              'grep -Fq \'capture_service_state\' "${UPDATE}" || fail "active service state is not captured"\n',
              'grep -Fq \'CAP_BIN_LINK="/usr/local/bin/cap"\' "${UPDATE}" || fail "update does not define global cap link"\ngrep -Fq \'"${INSTALL_DIR}/bin/cap"\' "${UPDATE}" || fail "update does not validate cap CLI"\ngrep -Fq \'capture_service_state\' "${UPDATE}" || fail "active service state is not captured"\n',
          )
          PY

      - name: Validate patch
        run: |
          bash -n install.sh
          bash -n update.sh
          bash tests/install_manager_test.sh
          bash tests/update_manager_test.sh
          bash tests/cli_scheduler_regression_test.sh

      - name: Commit patch and remove temporary workflow
        run: |
          rm -f .github/workflows/patch-145-cli.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh update.sh tests/install_manager_test.sh tests/update_manager_test.sh .github/workflows/patch-145-cli.yml
          git commit -m "Install cap CLI on fresh installs and updates"
          git push origin HEAD:fix/1.4.5-cli-and-scheduler
