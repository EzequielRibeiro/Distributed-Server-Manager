name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'release/RELEASE_TRIGGER'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  orchestrate:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate explicit release trigger
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' <version)
          TRIGGER=$(head -n1 release/RELEASE_TRIGGER | tr -d '\r\n')
          test "${TRIGGER}" = "${VERSION}"
          python3 tests/release_readiness_test.py
          test -f "release/RELEASE_NOTES_${VERSION}.md"

      - name: Guard canonical release identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' <version)
          TAG="v${VERSION}"

          RELEASE_EXISTS=0
          if gh release view "${TAG}" >/dev/null 2>&1; then
            RELEASE_EXISTS=1
          fi

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "${TAG}")
            if [[ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]]; then
              echo "Refusing to move existing ${TAG}: it resolves to ${TAG_COMMIT}, current release commit is ${GITHUB_SHA}." >&2
              exit 1
            fi
          elif [[ "${RELEASE_EXISTS}" == "1" ]]; then
            echo "Refusing to continue: GitHub Release ${TAG} exists but refs/tags/${TAG} is missing." >&2
            exit 1
          fi

      - name: Build standalone Agent installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bash release/build_agent_package.sh "${GITHUB_SHA}" dist
          python3 release/build_windows_agent_package.py "${GITHUB_SHA}" dist

      - name: Publish standalone Linux and Windows Agent releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' <version)
          LINUX_TAG="agent-linux-v${VERSION}"
          WINDOWS_TAG="agent-windows-v${VERSION}"

          for STANDALONE_TAG in "${LINUX_TAG}" "${WINDOWS_TAG}"; do
            if gh release view "${STANDALONE_TAG}" >/dev/null 2>&1; then
              if ! git rev-parse -q --verify "refs/tags/${STANDALONE_TAG}" >/dev/null; then
                echo "Standalone release ${STANDALONE_TAG} exists without a matching tag." >&2
                exit 1
              fi
              STANDALONE_COMMIT=$(git rev-list -n 1 "${STANDALONE_TAG}")
              if [[ "${STANDALONE_COMMIT}" != "${GITHUB_SHA}" ]]; then
                echo "Refusing to reuse ${STANDALONE_TAG}: it resolves to ${STANDALONE_COMMIT}, current release commit is ${GITHUB_SHA}." >&2
                exit 1
              fi
            fi
          done

          gh release view "${LINUX_TAG}" >/dev/null 2>&1 || \
            gh release create "${LINUX_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Capivara Agent Linux v${VERSION}" \
              --notes "Standalone Linux Agent installer for Capivara DSM v${VERSION}." \
              "dist/capivara-agent-linux-${VERSION}.tar.gz" \
              "dist/capivara-agent-linux-${VERSION}.tar.gz.sha256" \
              "dist/capivara-agent-linux-${VERSION}.manifest.json"

          gh release view "${WINDOWS_TAG}" >/dev/null 2>&1 || \
            gh release create "${WINDOWS_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Capivara Agent Windows v${VERSION}" \
              --notes "Standalone Windows Agent installer for Capivara DSM v${VERSION}." \
              "dist/capivara-agent-windows-${VERSION}.zip" \
              "dist/capivara-agent-windows-${VERSION}.zip.sha256" \
              "dist/capivara-agent-windows-${VERSION}.manifest.json"

      - name: Ensure canonical release tag matches approved release commit
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' <version)
          TAG="v${VERSION}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "${TAG}")
            if [[ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]]; then
              echo "Refusing to move existing ${TAG}: it resolves to ${TAG_COMMIT}, current release commit is ${GITHUB_SHA}." >&2
              exit 1
            fi
            echo "Tag ${TAG} already points to ${GITHUB_SHA}; leaving it unchanged."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "Capivara DSM ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Publish canonical GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' <version)
          TAG="v${VERSION}"
          rm -rf dist
          mkdir -p dist
          release/build_release.sh "${GITHUB_SHA}" dist
          bash release/build_agent_package.sh "${GITHUB_SHA}" dist
          python3 release/build_windows_agent_package.py "${GITHUB_SHA}" dist
          if gh release view "${TAG}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "${TAG}")
            if [[ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]]; then
              echo "Existing release ${TAG} belongs to ${TAG_COMMIT}; refusing to publish assets for ${GITHUB_SHA}." >&2
              exit 1
            fi
            echo "Release ${TAG} already exists for ${GITHUB_SHA}; leaving assets unchanged."
          else
            RELEASE_FLAGS=(--verify-tag --title "Capivara DSM ${TAG}" --notes-file "release/RELEASE_NOTES_${VERSION}.md")
            gh release create "${TAG}" \
              dist/*.tar.gz dist/*.zip dist/*.sha256 dist/*.manifest.json dist/*.minisig \
              "${RELEASE_FLAGS[@]}" 2>/dev/null || \
            gh release create "${TAG}" \
              dist/*.tar.gz dist/*.zip dist/*.sha256 dist/*.manifest.json \
              "${RELEASE_FLAGS[@]}"
          fi

      - name: Validate canonical public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' <version)
          python3 tests/published_release_smoke_test.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "v${VERSION}"

  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag and project version
        run: |
          VERSION=$(tr -d '\r\n' <version)
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match version v${VERSION}." >&2
            exit 1
          }

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq

      - name: Validate source
        run: |
          python3 tests/release_readiness_test.py
          git ls-files -z '*.sh' | xargs -0 -n1 bash -n
          find catalog games -type f -name '*.json' -print0 | xargs -0 -n1 jq empty
          python3 -m py_compile dashboard/server.py database/manager.py tests/dashboard_catalog_v2_test.py tests/database_test.py tests/update_baseline_upgrade_path_test.py release/build_windows_agent_package.py agents/windows/runtime/host_telemetry.py agents/windows/runtime/agent_entrypoint.py
          python3 -m unittest tests/dashboard_catalog_v2_test.py
          python3 -m unittest tests/database_test.py
          python3 -m unittest tests/update_baseline_upgrade_path_test.py
          python3 -m unittest tests/phase18_agent_updates_test.py
          python3 -m unittest tests/phase19_windows_agent_test.py
          python3 -m unittest tests/windows_agent_host_telemetry_contract_test.py
          python3 -m unittest tests/agent_update_release_selector_test.py
          bash tests/install_manager_test.sh
          sudo --preserve-env=GITHUB_ACTIONS bash tests/linux_install_smoke_test.sh
          bash tests/update_manager_test.sh
          bash tests/update_download_output_test.sh
          bash tests/update_cli_test.sh
          bash tests/catalog_v2_test.sh
          bash tests/release_build_test.sh
          bash tests/agent_package_test.sh

      - name: Build release artifacts
        run: |
          release/build_release.sh "${GITHUB_SHA}" dist
          bash release/build_agent_package.sh "${GITHUB_SHA}" dist
          python3 release/build_windows_agent_package.py "${GITHUB_SHA}" dist

      - name: Attest Linux Agent package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/capivara-agent-linux-*.tar.gz'

      - name: Attest Windows Agent package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/capivara-agent-windows-*.zip'

      - name: Publish GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' <version)
          TAG_COMMIT=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          if [[ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} resolves to ${TAG_COMMIT}, but workflow commit is ${GITHUB_SHA}." >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists for ${GITHUB_SHA}; leaving assets unchanged."
          else
            RELEASE_FLAGS=(--verify-tag --title "Capivara DSM ${GITHUB_REF_NAME}")
            if [[ -f "release/RELEASE_NOTES_${VERSION}.md" ]]; then
              RELEASE_FLAGS+=(--notes-file "release/RELEASE_NOTES_${VERSION}.md")
            else
              RELEASE_FLAGS+=(--generate-notes)
            fi
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then RELEASE_FLAGS+=(--prerelease); fi
            gh release create "${GITHUB_REF_NAME}" \
              dist/*.tar.gz dist/*.zip dist/*.sha256 dist/*.manifest.json dist/*.minisig \
              "${RELEASE_FLAGS[@]}" 2>/dev/null || \
            gh release create "${GITHUB_REF_NAME}" \
              dist/*.tar.gz dist/*.zip dist/*.sha256 dist/*.manifest.json \
              "${RELEASE_FLAGS[@]}"
          fi

      - name: Validate canonical public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tests/published_release_smoke_test.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}"
