name: Agent SSH Deploy

on:
  pull_request:
    paths:
      - 'bin/cap'
      - 'core/agent_ssh_deploy.py'
      - 'database/agent_deploy_cli.py'
      - 'database/agent_connection_test_cli.py'
      - 'database/agent_remote_secret_cli.py'
      - 'database/agent_deploy_topology.py'
      - 'database/agent_installation_preconfiguration.py'
      - 'agents/linux/installer/bootstrap-release.sh'
      - 'agents/linux/installer/install-agent.sh'
      - 'tests/agent_ssh_deploy_test.py'
      - 'tests/agent_ssh_bootstrap_diagnostic_test.py'
      - 'tests/agent_ssh_cross_platform_test.py'
      - 'tests/agent_deploy_preconfiguration_test.py'
      - 'docs/architecture/agent-ssh-deploy.md'
      - 'docs/agents/**'
      - '.github/workflows/agent-ssh-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'bin/cap'
      - 'core/agent_ssh_deploy.py'
      - 'database/agent_deploy_cli.py'
      - 'database/agent_connection_test_cli.py'
      - 'database/agent_remote_secret_cli.py'
      - 'database/agent_deploy_topology.py'
      - 'database/agent_installation_preconfiguration.py'
      - 'agents/linux/installer/bootstrap-release.sh'
      - 'agents/linux/installer/install-agent.sh'
      - 'tests/agent_ssh_deploy_test.py'
      - 'tests/agent_ssh_bootstrap_diagnostic_test.py'
      - 'tests/agent_ssh_cross_platform_test.py'
      - 'tests/agent_deploy_preconfiguration_test.py'
      - 'docs/architecture/agent-ssh-deploy.md'
      - 'docs/agents/**'
      - '.github/workflows/agent-ssh-deploy.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate syntax
        run: |
          bash -n bin/cap
          bash -n agents/linux/installer/bootstrap-release.sh
          bash -n agents/linux/installer/install-agent.sh
          python3 -m py_compile \
            core/agent_ssh_deploy.py \
            database/agent_deploy_cli.py \
            database/agent_connection_test_cli.py \
            database/agent_remote_secret_cli.py \
            database/agent_deploy_topology.py \
            database/agent_installation_preconfiguration.py \
            tests/agent_ssh_deploy_test.py \
            tests/agent_ssh_bootstrap_diagnostic_test.py \
            tests/agent_ssh_cross_platform_test.py \
            tests/agent_deploy_preconfiguration_test.py

      - name: Test SSH deployment contracts
        run: python3 -m unittest tests/agent_ssh_deploy_test.py

      - name: Test bootstrap diagnostic priority
        run: python3 -m unittest tests/agent_ssh_bootstrap_diagnostic_test.py

      - name: Test cross-platform SSH contracts
        run: python3 -m unittest tests/agent_ssh_cross_platform_test.py

      - name: Test CLI and Dashboard preconfiguration parity
        run: python3 -m unittest tests/agent_deploy_preconfiguration_test.py

      - name: Security contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('core/agent_ssh_deploy.py'),
              Path('database/agent_deploy_cli.py'),
              Path('database/agent_connection_test_cli.py'),
              Path('database/agent_deploy_topology.py'),
              Path('bin/cap'),
          ]
          failures = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              for forbidden in ('shell=True', 'StrictHostKeyChecking=no'):
                  if forbidden in text:
                      failures.append(f'{path}: forbidden {forbidden}')

          for path in (Path('database/agent_deploy_cli.py'), Path('database/agent_connection_test_cli.py')):
              text = path.read_text(encoding='utf-8')
              if 'add_argument("--password")' in text or "add_argument('--password')" in text:
                  failures.append(f'{path}: direct --password CLI option is forbidden')

          cap = Path('bin/cap').read_text(encoding='utf-8')
          if '--password SENHA' in cap or '--password PASSWORD' in cap:
              failures.append('bin/cap: direct password syntax is forbidden')

          if failures:
              raise SystemExit('\n'.join(failures))
          PY
          ! grep -n -- '--pairing-token "${PAIRING_TOKEN}"' agents/linux/installer/bootstrap-release.sh
