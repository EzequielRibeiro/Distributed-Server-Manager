name: Universal Smart Backup
on:
  pull_request:
    paths:
      - 'core/backup_platform.py'
      - 'core/backup_intelligence.py'
      - 'database/backup_*'
      - 'database/migrations/036_universal_smart_backup.sql'
      - 'database/migrations_mysql/036_universal_smart_backup.sql'
      - 'database/migrations_postgresql/036_universal_smart_backup.sql'
      - 'dashboard/backup_*'
      - 'dashboard/agent_heartbeat_api.py'
      - 'dashboard/server_part13.py'
      - 'dashboard/server_part17.py'
      - 'agents/linux/runtime/backup_client.py'
      - 'agents/linux/runtime/agent.py'
      - 'release/build_agent_package.sh'
      - 'bin/cap'
      - 'tests/universal_smart_backup_test.py'
      - 'tests/smart_backup_intelligence_test.py'
      - 'docs/architecture/smart-backup-v2.md'
      - '.github/workflows/universal-smart-backup.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax
        run: |
          bash -n bin/cap release/build_agent_package.sh
          python3 -m py_compile core/backup_platform.py core/backup_intelligence.py database/backup_repository.py database/backup_cli.py dashboard/backup_api.py dashboard/backup_http.py dashboard/agent_heartbeat_api.py dashboard/server_part13.py dashboard/server_part17.py agents/linux/runtime/backup_client.py agents/linux/runtime/agent.py
      - name: Test Universal Smart Backup
        run: |
          python3 -m unittest tests/universal_smart_backup_test.py
          python3 -m unittest tests/smart_backup_intelligence_test.py
      - name: Verify composition and package contracts
        run: |
          grep -Fq 'BACKUP_PATH' dashboard/server_part13.py
          grep -Fq 'import server_part16 as integration' dashboard/server_part17.py
          grep -Fq 'agents/linux/runtime' release/build_agent_package.sh
          grep -Fq 'RUNTIME_SOURCES' release/build_agent_package.sh
          grep -Fq 'backup-store' bin/cap
          grep -Fq 'preset-apply' bin/cap
