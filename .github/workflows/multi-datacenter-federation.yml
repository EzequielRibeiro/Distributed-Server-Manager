name: Multi-Datacenter Federation
on:
  pull_request:
    paths:
      - 'core/federation.py'
      - 'database/federation_*'
      - 'database/schema_baseline.py'
      - 'database/schemas/**'
      - 'bin/cap'
      - 'tests/multi_datacenter_federation_test.py'
      - 'docs/architecture/multi-datacenter-federation.md'
      - '.github/workflows/multi-datacenter-federation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax
        run: |
          bash -n bin/cap
          python3 -m py_compile core/federation.py database/federation_repository.py database/federation_cli.py
      - name: Test E1 contracts
        run: python3 -m unittest tests/multi_datacenter_federation_test.py
      - name: Verify baseline and integration contracts
        run: |
          grep -Fq 'cap federation' bin/cap
          PYTHONPATH=database python3 - <<'PY'
          from schema_baseline import load_schema_baseline
          for backend in ('sqlite', 'postgresql', 'mysql'):
              assert 'federation_members' in load_schema_baseline(backend).sql
          PY
