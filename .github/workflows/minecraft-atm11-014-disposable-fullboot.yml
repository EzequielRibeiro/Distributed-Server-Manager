name: ATM11 0.14 Disposable Full Modpack Boot

on:
  pull_request:
    paths:
      - '.github/workflows/minecraft-atm11-014-disposable-fullboot.yml'
      - 'tests/minecraft_serverpack_customer_single_action_e2e_test.py'
      - 'tests/minecraft_serverpack_authenticated_493_http_e2e_test.py'
      - 'tests/minecraft_serverpack_customer_official_http_upload_test.py'
      - 'tests/minecraft_serverpack_two_transient_systemd_e2e_test.py'
      - 'tests/minecraft_serverpack_customer_official_preview_session_test.py'
      - 'tests/minecraft_serverpack_official_systemd_health_e2e.py'
      - 'agents/linux/runtime/minecraft_serverpack_boot_witness.py'
      - 'agents/linux/runtime/minecraft_serverpack_live_readiness.py'
      - 'database/content_repository.py'
      - 'dashboard/minecraft_serverpack_observation_events.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atm11-full-disposable:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Verify disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -e /opt/dsm/runtime/hybrid-instance-storage
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 8388608
          test "$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)" -gt 5242880
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download and authenticate official ATM11 0.13 and 0.14 Server Packs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsm-atm11-014"
          cd "$RUNNER_TEMP/dsm-atm11-014"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 360 \
            --output ServerFiles-0.14.0-beta.zip \
            https://mediafilez.forgecdn.net/files/9426/897/ServerFiles-0.14.0-beta.zip
          echo 'b8635562de0931eb5cadb51954c0fb78658033928ef54b5f73be6cae5c8897fa  ServerFiles-0.14.0-beta.zip' | sha256sum --check -
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 360             --output ServerFiles-0.13.0-beta.zip             https://mediafilez.forgecdn.net/files/9343/842/ServerFiles-0.13.0-beta.zip
          echo '78cbca8ffd26fef6d5bef27dcf44fb53cf118c20d9da6a19d9af7911b6d8768e  ServerFiles-0.13.0-beta.zip' | sha256sum --check -
          python3 - <<'PYZIP'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('ServerFiles-0.13.0-beta.zip') as z:
              mods=[n for n in z.namelist() if n.startswith('mods/') and n.endswith('.jar')]
              assert len(mods)==282
              assert 'neoforge-26.1.2.124-installer.jar' in z.namelist()
              print('OFFICIAL_013_BASELINE_VERIFIED',len(mods),flush=True)
          PYZIP
      - name: Stream official 751 MiB ZIP via Customer HTTP PUT to Agent ACK and preview
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          DSM_1013_OFFICIAL_REAL_UPLOAD: '1'
        run: |
          set -euo pipefail
          export DSM_1013_OFFICIAL_PACK_ROOT="$RUNNER_TEMP/dsm-atm11-014"
          python3 -m unittest -v tests.minecraft_serverpack_customer_official_http_upload_test.OfficialCustomerRealPutAgentAckE2E.test_customer_upload_agent_real_get_ack_and_official_preview
      - name: Official 751 MiB ZIP between isolated Controller and Agent systemd services
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CAPIVARA_RUN_SYSTEMD_FINALIZATION_E2E: '1'
          DSM_1013_SYSTEMD_OFFICIAL_ZIP: '1'
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test ! -e /opt/dsm/runtime/hybrid-instance-storage
          test -d /run/systemd/system
          export DSM_1013_OFFICIAL_PACK_ROOT="$RUNNER_TEMP/dsm-atm11-014"
          sudo -n env PYTHONPATH="$GITHUB_WORKSPACE"             PYTHONDONTWRITEBYTECODE="$PYTHONDONTWRITEBYTECODE"             GITHUB_ACTIONS="$GITHUB_ACTIONS"             RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT"             CAPIVARA_RUN_SYSTEMD_FINALIZATION_E2E="$CAPIVARA_RUN_SYSTEMD_FINALIZATION_E2E"             DSM_1013_SYSTEMD_OFFICIAL_ZIP="$DSM_1013_SYSTEMD_OFFICIAL_ZIP"             DSM_1013_OFFICIAL_PACK_ROOT="$DSM_1013_OFFICIAL_PACK_ROOT"             python3 -m unittest -v               tests.minecraft_serverpack_two_transient_systemd_e2e_test.TwoDisposableSystemdServicesE2E.test_separate_systemd_units_authenticated_agent_heartbeat_ack             2>&1 | tee "$RUNNER_TEMP/dsm1013-systemd-official.log"
          grep -q 'DSM1013_TWO_SYSTEMD_OFFICIAL_ZIP_PASS' "$RUNNER_TEMP/dsm1013-systemd-official.log"
      - name: Extract 291 mods and install NeoForge 26.1.2.126
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dsm-atm11-014"
          python3 - <<'PY'
          import shutil,stat,zipfile
          from pathlib import Path
          root=Path.cwd()
          with zipfile.ZipFile("ServerFiles-0.14.0-beta.zip") as archive:
              assert archive.testzip() is None
              entries=archive.infolist()
              jars=[i for i in entries if i.filename.startswith("mods/") and i.filename.endswith(".jar")]
              assert len(jars)==291, f"expected 291 mods, found {len(jars)}"
              for i in entries:
                  name=i.filename
                  parts=Path(name).parts
                  assert name and not name.startswith("/") and "\\" not in name and ".." not in parts
                  assert not stat.S_ISLNK(i.external_attr>>16)
                  target=root.joinpath(*parts)
                  assert target.resolve().is_relative_to(root.resolve())
                  if i.is_dir():target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      with archive.open(i) as source,target.open("xb") as dest:
                          shutil.copyfileobj(source,dest,1024*1024)
          assert len(list((root/"mods").glob("*.jar")))==291
          assert not (root/"world").exists()
          print("EXTRACTED_291_OFFICIAL_MODS",flush=True)
          PY
          timeout 360 java -jar neoforge-26.1.2.126-installer.jar --installServer
          test -f libraries/net/neoforged/neoforge/26.1.2.126/unix_args.txt
          printf 'eula=true\n' > eula.txt
          printf 'server-ip=127.0.0.1\nserver-port=25596\nonline-mode=false\nmax-players=1\nview-distance=2\nsimulation-distance=2\nenable-query=false\nenable-rcon=false\n' > server.properties
      - name: Session-authenticated official ZIP preview and read-only revalidation
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          export DSM_1013_OFFICIAL_PACK_ROOT="$RUNNER_TEMP/dsm-atm11-014"
          python3 -m unittest -v tests.minecraft_serverpack_customer_official_preview_session_test.CustomerOfficialPreviewSessionE2E.test_customer_cookie_real_014_zip_preview_revalidate_and_deny_unsafe
      - name: Boot actual ATM11 with all 291 mods and stop gracefully
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dsm-atm11-014"
          python3 - <<'PY'
          import json,os,re,subprocess,time
          from pathlib import Path
          root=Path.cwd();log=root/"atm11-boot.log"
          result={"kind":"ATM11RealFullBoot","pack":"0.14.0-beta","loader":"26.1.2.126",
                  "mod_jars":291,"boot_done":False,"clean_stop":False,
                  "world_generated":False}
          started=time.monotonic();proc=None
          try:
              with log.open("w") as out:
                  proc=subprocess.Popen(["java","-Xms1024M","-Xmx5120M",
                      "-Djava.awt.headless=true",
                      "@libraries/net/neoforged/neoforge/26.1.2.126/unix_args.txt","nogui"],
                      cwd=root,stdin=subprocess.PIPE,stdout=out,stderr=subprocess.STDOUT,
                      text=True,env={**os.environ,"HOME":str(root),"TMPDIR":str(root)})
                  print("FULL_MODPACK_JVM_STARTED",flush=True)
                  while time.monotonic()-started<720:
                      time.sleep(3)
                      if re.search(r"Done \([0-9.]+s\)!",log.read_text(errors="replace")):
                          result["boot_done"]=True
                          print("FULL_MODPACK_BOOT_DONE",flush=True)
                          break
                      if proc.poll() is not None:break
                  if proc.poll() is None:
                      if result["boot_done"]:time.sleep(5)
                      try:
                          proc.stdin.write("stop\n");proc.stdin.flush()
                          proc.wait(timeout=75)
                          result["clean_stop"]=proc.returncode==0
                      except (BrokenPipeError,subprocess.TimeoutExpired):
                          proc.terminate()
                          try:proc.wait(timeout=10)
                          except subprocess.TimeoutExpired:
                              proc.kill();proc.wait(timeout=10)
                  result["exit_code"]=proc.returncode
              world=root/"world/level.dat"
              result["world_generated"]=world.is_file() and world.stat().st_size>0
          except Exception as exc:
              result["exception"]=repr(exc)
          finally:
              if proc and proc.poll() is None:
                  proc.kill();proc.wait(timeout=10)
              result["duration_seconds"]=round(time.monotonic()-started,2)
              result["pass"]=bool(result["boot_done"] and result["clean_stop"]
                    and result["world_generated"] and result.get("exit_code")==0)
              lines=log.read_text(errors="replace").splitlines() if log.exists() else []
              result["log_tail"]=lines[-70:]
              (root/"boot-evidence.json").write_text(json.dumps(result,indent=2)+"\n")
              print("ATM11_BOOT_RESULT",json.dumps({k:v for k,v in result.items() if k!="log_tail"}),flush=True)
              print("\n".join(result["log_tail"]),flush=True)
          if not result["pass"]:raise SystemExit("full 291-mod boot not attested")
          PY
      - name: Install pinned Chromium for same real-JVM customer browser
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/dsm1013-playwright-browsers"
          npm install --no-save --ignore-scripts --no-package-lock playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
      - name: Live official 291-mod systemd JVM proof and authenticated Controller health
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CAPIVARA_RUN_1013_REAL_SYSTEMD_HEALTH: '1'
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test ! -e /opt/dsm/runtime/hybrid-instance-storage
          test -d /run/systemd/system
          sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            CAPIVARA_RUN_1013_REAL_SYSTEMD_HEALTH="$CAPIVARA_RUN_1013_REAL_SYSTEMD_HEALTH" \
            DSM_SERVERPACK_HEALTH_PROMOTION_ENABLED=1 \
            DSM_1013_OFFICIAL_PACK_ROOT="$RUNNER_TEMP/dsm-atm11-014" \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH="$GITHUB_WORKSPACE" \
            PATH="$PATH" \
            CAPIVARA_RUN_1013_BROWSER_E2E=1 \
            DSM_1013_BROWSER_REAL_JVM=1 \
            PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/dsm1013-playwright-browsers" \
            python3 -u tests/minecraft_serverpack_official_systemd_health_e2e.py \
            2>&1 | tee "$RUNNER_TEMP/dsm-atm11-014/systemd-health-run.log"
          grep -q 'DSM1013_REAL_JVM_CONTROLLER_HEALTH_READY' "$RUNNER_TEMP/dsm-atm11-014/systemd-health-run.log"
          grep -q 'DSM1013_REAL_JVM_CONTROLLER_HEALTH_REVOKED' "$RUNNER_TEMP/dsm-atm11-014/systemd-health-run.log"
          grep -q 'DSM1013_REAL_JVM_AUTHENTICATED_BROWSER_PASS' "$RUNNER_TEMP/dsm-atm11-014/systemd-health-run.log"
          grep -q 'owned_real_jvm_same_controller' "$RUNNER_TEMP/dsm-atm11-014/systemd-health-run.log"
          test -s "$RUNNER_TEMP/dsm-atm11-014/dsm1013-real-browser-ready.png"
          test -s "$RUNNER_TEMP/dsm-atm11-014/dsm1013-real-browser.png"
          test -s "$RUNNER_TEMP/dsm-atm11-014/systemd-health-evidence.json"
      - name: Single customer HTTP action, official 0.13 to 0.14 boot, authenticated ACK and injected rollback
        shell: bash
        env:
          CAPIVARA_RUN_OFFICIAL_ATM11_JOINED_E2E: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          export DSM_1013_OFFICIAL_PACK_ROOT="$RUNNER_TEMP/dsm-atm11-014"
          python3 -m unittest -v             tests.minecraft_serverpack_customer_single_action_e2e_test.OfficialATM11SingleActionBootE2E.test_one_action_to_physical_swap_controller_cas_authenticated_ack
      - name: Retain diagnostic boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atm11-014-fullboot-evidence
          path: |
            ${{ runner.temp }}/dsm-atm11-014/atm11-boot.log
            ${{ runner.temp }}/dsm-atm11-014/boot-evidence.json
            ${{ runner.temp }}/dsm-atm11-014/joined-one-action-boot.log
            ${{ runner.temp }}/dsm-atm11-014/joined-one-action-boot.json
            ${{ runner.temp }}/dsm-atm11-014/systemd-health-run.log
            ${{ runner.temp }}/dsm-atm11-014/systemd-health-evidence.json
            ${{ runner.temp }}/dsm-atm11-014/dsm1013-real-browser*.png
            ${{ runner.temp }}/dsm1013-systemd-official.log
          if-no-files-found: ignore
          retention-days: 7
