#############################################
# Capivara Distributed Server Manager
#
# Agent Configuration
#
# Este arquivo é gerado pelo instalador.
#
# Nenhum valor abaixo deve ser considerado
# permanente ou fixo.
#
#############################################


#############################################
# Agent Identity
#############################################

# Identificador único do Agent.
#
# Gerado durante instalação/registro.
#
# Antes do registro:
# AGENT_ID=
#
AGENT_ID=""


# Nome amigável do Agent.
#
# Definido pelo administrador.
#
AGENT_NAME=""


# Status do registro no Controller.
#
# Valores possíveis:
#
# pending
# registered
# disabled
#
AGENT_STATUS="pending"



#############################################
# Controller Connection
#############################################

# Endpoint do Controller Capivara.
#
# Pode ser:
#
# IP:
# https://xxx.xxx.xxx.xxx
#
# DNS:
# https://capivara.exemplo.com
#
CONTROLLER_ENDPOINT=""


# Porta do Controller.
#
# Definida na instalação.
#
CONTROLLER_PORT=""


# Protocolo de comunicação.
#
# http
# https
#
CONTROLLER_PROTOCOL=""



# Token/chave de autenticação
#
# Gerado pelo Controller após registro.
#
AGENT_TOKEN=""



#############################################
# Local System Identity
#############################################

# Usuário que executa o Agent.
#
# Descoberto ou definido na instalação.
#
DSM_USER=""


# Grupo do usuário do Agent.
#
# Descoberto ou definido na instalação.
#
DSM_GROUP=""


# Hostname do sistema.
#
# Obtido automaticamente.
#
HOSTNAME=""


# Identificador do Node.
#
# NÃO é definido no código.
#
# Gerado pelo Controller.
#
DSM_NODE_ID=""



#############################################
# Installation Paths
#############################################

# Diretório raiz do Agent.
#
# Definido durante instalação.
#
#DSM_ROOT=""


# Diretório de configuração.
#
#DSM_CONFIG_DIR=""


# Diretório de runtime.
#
#DSM_RUNTIME_DIR=""


# Diretório de logs.
#
#DSM_LOG_DIR=""


# Diretório das instâncias.
#
# Definido pelo administrador.
#
#INSTANCE_ROOT=""



#############################################
# Runtime
#############################################

# Usuário/grupo serão aplicados
# dinamicamente nos serviços systemd.

SYSTEMD_ENABLED=""



# Intervalo padrão dos workers.
#
# Definido pela instalação.
#
WORKER_INTERVAL=""


# Timezone do Agent.
#
TIMEZONE=""



#############################################
# Network
#############################################

# IP detectado do Agent.
#
# Pode mudar.
#
AGENT_IP=""


# DNS público do Agent (opcional).
#
AGENT_DNS=""


# Porta de comunicação do Agent.
#
AGENT_PORT=""



#############################################
# Security
#############################################

# Certificado do Agent.
#
# Gerado no registro.
#
CERTIFICATE=""


# Fingerprint do Agent.
#
AGENT_FINGERPRINT=""



#############################################
# Features
#############################################

# Habilitação de módulos.

ENABLE_PROCESS_MANAGER="1"

ENABLE_WATCHDOG="1"

ENABLE_RECOVERY="1"

ENABLE_EVENTS="1"

ENABLE_BACKUP="1"

ENABLE_METRICS="1"



#############################################
# Registration Metadata
#############################################

REGISTER_DATE=""

LAST_CONTROLLER_SYNC=""

CONFIG_VERSION="1.0"