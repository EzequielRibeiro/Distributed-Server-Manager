#!/bin/bash
# =============================================================
# DSM Alert Engine v1.2.0
#
# Arquivo:
#   config/alerts.conf
#
# Função:
#   Configuração central dos alertas DSM
#
# =============================================================

# =============================================================
# GERAL
# =============================================================

# Ativa/desativa sistema de alertas
ALERTS_ENABLED=true

# Intervalo de avaliação dos sensores
# segundos
ALERT_CHECK_INTERVAL=60

# Tempo mínimo entre alertas iguais
# evita spam
ALERT_COOLDOWN_SECONDS=900

# Quantidade máxima de eventos mantidos
ALERT_HISTORY_LIMIT=5000

# =============================================================
# CPU - PROCESSO DAYZ
# =============================================================

# Atenção
DAYZ_CPU_WARNING=80

# Crítico
DAYZ_CPU_CRITICAL=95

# Tempo acima do limite
# para disparar
DAYZ_CPU_DURATION=180

# =============================================================
# CPU - HOST
# =============================================================

HOST_CPU_WARNING=85
HOST_CPU_CRITICAL=95
HOST_CPU_DURATION=120

# =============================================================
# MEMÓRIA RAM
# =============================================================

# Percentual usado
RAM_WARNING=85
RAM_CRITICAL=95
RAM_DURATION=120

# =============================================================
# DISCO
# =============================================================

# Espaço livre mínimo (%)
DISK_WARNING_FREE=20
DISK_CRITICAL_FREE=10

# Caminho monitorado
DISK_PATH="/"

# =============================================================
# TEMPERATURA
# =============================================================

# Celsius
TEMP_WARNING=75
TEMP_CRITICAL=90
TEMP_DURATION=60

# =============================================================
# REDE
# =============================================================

# Tráfego elevado MB/s
NETWORK_RX_WARNING=100
NETWORK_RX_CRITICAL=500
NETWORK_TX_WARNING=100
NETWORK_TX_CRITICAL=500

# =============================================================
# SERVIDOR DAYZ
# =============================================================

# Detectar processo parado
DAYZ_OFFLINE_ALERT=true

# Tempo offline antes de alertar
DAYZ_OFFLINE_DELAY=120

# Tentativas de recuperação automática
RECOVERY_ATTEMPTS=5

# Intervalo entre recuperações
RECOVERY_INTERVAL=60

# =============================================================
# WATCHDOG
# =============================================================

WATCHDOG_ENABLED=true

# Quantidade de falhas antes de reiniciar
WATCHDOG_FAILURE_LIMIT=3

# Reinício automático
WATCHDOG_AUTO_RESTART=true

# =============================================================
# NÍVEIS DE ALERTA
# =============================================================

# INFO:
# somente registro
ENABLE_INFO_ALERTS=true

# WARNING:
# Dashboard + histórico
ENABLE_WARNING_ALERTS=true

# CRITICAL:
# Dashboard + Discord
ENABLE_CRITICAL_ALERTS=true

# =============================================================
# DISCORD
# =============================================================

DISCORD_ENABLED=true

# Webhook será carregado de arquivo seguro
DISCORD_WEBHOOK_FILE="/opt/dsm/config/discord.secret"

# Enviar:
DISCORD_SEND_WARNING=true
DISCORD_SEND_CRITICAL=true

# Menção:
# @everyone
DISCORD_MENTION_CRITICAL=false

# =============================================================
# DASHBOARD
# =============================================================

# Mostrar alertas ativos
DASHBOARD_SHOW_ACTIVE=true

# Quantidade no HUD
DASHBOARD_ALERT_LIMIT=10

# =============================================================
# CORES HUD
# =============================================================

ALERT_COLOR_OK="#7c9473"
ALERT_COLOR_WARNING="#c99a3c"
ALERT_COLOR_CRITICAL="#a13d3d"

# =============================================================
# RECUPERAÇÃO AUTOMÁTICA
# =============================================================

AUTO_RECOVERY_ENABLED=true

# Serviços permitidos para restart
RECOVERY_SERVICE_DAYZ=true
RECOVERY_SERVICE_MONITOR=true

# Delay após recuperação
RECOVERY_COOLDOWN=300

# =============================================================
# LOG
# =============================================================

ALERT_LOG_LEVEL="INFO"
ALERT_LOG_FILE="/opt/dsm/runtime/alerts/alerts.log"

# =============================================================
# FIM
# =============================================================
