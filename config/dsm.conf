#################################
# Capivara Distributed Server Manager
# DSM Configuration
#################################

# =============================================================
# DSM Version
# =============================================================

DSM_VERSION="1.1.0"
INSTALLER_VERSION="1.1.0"

# =============================================================
# User / Node Role
# =============================================================

DSM_USER=""
DSM_GROUP=""
DSM_HOME=""

# Papel local autoritativo para dispatch da CLI.
# Valores: controller | agent | hybrid
DSM_NODE_ROLE=""

# =============================================================
# Universal Resource Identity
# Host -> Node -> Game -> Instance
# =============================================================

DSM_SERVER_ID="server01"
DSM_GAME_ID=""
DSM_INSTANCE_ID=""

DSM_SERVER="$DSM_SERVER_ID"
DSM_GAME="$DSM_GAME_ID"
DSM_INSTANCE="$DSM_INSTANCE_ID"

# =============================================================
# Paths / Database
# =============================================================

INSTALL_DIR="/opt/dsm"
DSM_RUNTIME="/opt/dsm/runtime"
DSM_LOG_DIR="/opt/dsm/logs"
DSM_DATA_DIR="/opt/dsm/data"
DSM_DATABASE_DRIVER="sqlite"
DSM_DATABASE="/opt/dsm/data/capivara.db"
DSM_DATABASE_HOST=""
DSM_DATABASE_PORT=""
DSM_DATABASE_NAME="capivara"
DSM_DATABASE_USER=""
DSM_DATABASE_PASSWORD_FILE=""
DSM_DATABASE_TLS="preferred"
BACKUP_DIR="/opt/dsm-backup"

# =============================================================
# Native Game Runtime
# =============================================================

DSM_PROVIDER="native"
GAME_BINARY=""
SERVER_CONFIG=""
SERVER_PROFILES=""
SERVER_PORT=""
DSM_PID_FILE="/opt/dsm/runtime/server.pid"
SERVER_LOG="/opt/dsm/logs/server.log"

# =============================================================
# Installation
# =============================================================

INSTALL_DATE=""
INSTALL_LOG="/var/log/dsm-install.log"

# =============================================================
# Services
# =============================================================

SYSTEMD_ENABLED="1"
DASHBOARD_ENABLED="1"
DISCORD_ENABLED="0"

# =============================================================
# GitHub
# =============================================================

GITHUB_BRANCH="main"
GITHUB_REPOSITORY="https://github.com/EzequielRibeiro/Distributed-Server-Manager"

# =============================================================
# Steam defaults
# Game-specific App IDs belong to Catalog/runtime definitions.
# =============================================================

APPID_WORKSHOP=""
APPID_SERVER=""

# =============================================================
# Runtime
# Durable events, alerts and audit history live in the configured database.
# =============================================================

DSM_MOD_RUNTIME="$DSM_RUNTIME/mods"
DSM_INTERVAL="10"
