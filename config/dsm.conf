#################################
# Capivara Distributed Server Manager
# DSM Configuration
#################################


# =============================================================
# DSM Version
# =============================================================

DSM_VERSION="1.1.0"
INSTALLER_VERSION="1.1.0"



# =============================================================
# User
# =============================================================

DSM_USER=""
DSM_GROUP=""
DSM_HOME=""



# =============================================================
# Universal Resource Identity
#
# Identidade distribuída:
# Host -> Node -> Game -> Instance
# =============================================================

DSM_SERVER_ID="server01"
DSM_GAME_ID="dayz"
DSM_INSTANCE_ID="survival01"


# Compatibilidade Runtime

DSM_SERVER="$DSM_SERVER_ID"
DSM_GAME="$DSM_GAME_ID"
DSM_INSTANCE="$DSM_INSTANCE_ID"



# =============================================================
# Paths
# =============================================================

INSTALL_DIR="/opt/dsm"

DSM_RUNTIME="/opt/dsm/runtime"
DSM_LOG_DIR="/opt/dsm/logs"
DSM_DATA_DIR="/opt/dsm/data"
DSM_DATABASE_DRIVER="sqlite"
DSM_DATABASE="/opt/dsm/data/capivara.db"
DSM_DATABASE_HOST=""
DSM_DATABASE_PORT=""
DSM_DATABASE_NAME="capivara"
DSM_DATABASE_USER=""
DSM_DATABASE_PASSWORD_FILE=""
DSM_DATABASE_TLS="preferred"

BACKUP_DIR="/opt/dsm-backup"



# =============================================================
# Instance
# =============================================================

INSTANCE_NAME="dayzserver"



# =============================================================
# Provider
#
# native  = DSM controla diretamente o processo
# linuxgsm = compatibilidade legado
# =============================================================

DSM_PROVIDER="native"



# =============================================================
# Game Runtime
# =============================================================

GAME_BINARY=""



# =============================================================
# Server Runtime
# =============================================================

SERVER_CONFIG="serverDZ.cfg"

SERVER_PROFILES=""

SERVER_PORT="2302"



# =============================================================
# Runtime State
# =============================================================

DSM_PID_FILE="/opt/dsm/runtime/server.pid"

SERVER_LOG="/opt/dsm/logs/server.log"



# =============================================================
# LinuxGSM Compatibility Provider
#
# Mantido para migração
# =============================================================

LINUXGSM_PATH=""

SERVERFILES_PATH=""



# =============================================================
# Installation
# =============================================================

INSTALL_DATE="2026-08-01 12:29:03"

INSTALL_LOG="/var/log/dsm-install.log"



# =============================================================
# Services
# =============================================================

SYSTEMD_ENABLED="1"

DASHBOARD_ENABLED="1"

DISCORD_ENABLED="0"



# =============================================================
# GitHub
# =============================================================

GITHUB_BRANCH="main"

GITHUB_REPOSITORY="https://github.com/EzequielRibeiro/Distributed-Server-Manager"



# =============================================================
# Steam
# =============================================================

APPID_WORKSHOP="221100"

APPID_SERVER="223350"



# =============================================================
# Mods
# =============================================================

WORKSHOP_IDS="1828439124:@VPPAdminTools;2918418331:@SurvivorAnimations;2545327648:@DabsFramework;2155726353:@MortysWeapons;1646187754:@CodeLock;1832448183:@FlipTransport;1559212036:@CF;2276010135:@DayzEditorLoader;2303554682:@DogTags;3010090417:@RaidShedule;1797720064:@WindstridesClothingPack"



# =============================================================
# Universal Events
# =============================================================

DSM_EVENT_QUEUE="$DSM_RUNTIME/events/queue.json"

DSM_EVENT_HISTORY="$DSM_RUNTIME/events/history.json"



# =============================================================
# Mods Runtime
# =============================================================

DSM_MOD_RUNTIME="$DSM_RUNTIME/mods"

DSM_MOD_STATE="$DSM_MOD_RUNTIME/state.json"

DSM_MOD_HISTORY="$DSM_MOD_RUNTIME/history.json"



# =============================================================
# Workers
# =============================================================

DSM_INTERVAL="10"



# =============================================================
# Feature Flags
# =============================================================

DSM_EVENTS_ENABLED="1"

DSM_MOD_EVENTS_ENABLED="1"

DSM_BACKUP_EVENTS_ENABLED="1"
