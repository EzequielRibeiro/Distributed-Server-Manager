#################################
# Capivara Distributed Server Manager
# DSM Configuration
#################################

# =============================================================
# DSM Version
# =============================================================

DSM_VERSION="1.1.0"
INSTALLER_VERSION="1.1.0"

# =============================================================
# User / Node Role
# =============================================================

DSM_USER=""
DSM_GROUP=""
DSM_HOME=""

# Papel local autoritativo para dispatch da CLI.
# Valores: controller | agent | hybrid
DSM_NODE_ROLE=""

# =============================================================
# Universal Resource Identity
# Host -> Node -> Game -> Instance
# =============================================================

DSM_SERVER_ID="server01"
DSM_GAME_ID=""
DSM_INSTANCE_ID=""

DSM_SERVER="$DSM_SERVER_ID"
DSM_GAME="$DSM_GAME_ID"
DSM_INSTANCE="$DSM_INSTANCE_ID"

# =============================================================
# Paths / Database
# =============================================================

INSTALL_DIR="/opt/dsm"
DSM_RUNTIME="/opt/dsm/runtime"
DSM_LOG_DIR="/opt/dsm/logs"
DSM_DATA_DIR="/opt/dsm/data"
DSM_DATABASE_DRIVER="sqlite"
DSM_DATABASE="/opt/dsm/data/capivara.db"
DSM_DATABASE_HOST=""
DSM_DATABASE_PORT=""
DSM_DATABASE_NAME="capivara"
DSM_DATABASE_USER=""
DSM_DATABASE_PASSWORD_FILE=""
DSM_DATABASE_TLS="preferred"
BACKUP_DIR="/opt/dsm-backup"

# =============================================================
# Controller / Dashboard transport
# =============================================================

# http is explicitly supported for trusted local/LAN installations.
# https is recommended for any externally reachable Controller.
# DSM_WEB_PORT is the local bind port. DSM_PUBLIC_PORT is the port that
# Agents/clients reach through Internet/NAT; both may be identical.
DSM_WEB_SCHEME="http"
DSM_WEB_HOST="0.0.0.0"
DSM_WEB_PORT="8080"
DSM_PUBLIC_HOST=""
DSM_PUBLIC_PORT="8080"
DSM_CONTROLLER_PUBLIC_URL=""

# Certificate modes: disabled | letsencrypt | existing | selfsigned
DSM_TLS_CERT_MODE="disabled"
# Generic ACME validation: disabled | http-01 | dns-01-manual | dns-01-hook
DSM_TLS_ACME_CHALLENGE="disabled"
# For dns-01-hook the scripts are provider-neutral and receive Certbot's
# standard CERTBOT_DOMAIN / CERTBOT_VALIDATION environment variables.
DSM_TLS_DNS_AUTH_HOOK=""
DSM_TLS_DNS_CLEANUP_HOOK=""
DSM_TLS_CERT_FILE=""
DSM_TLS_KEY_FILE=""
DSM_TLS_CA_FILE=""

# =============================================================
# Native Game Runtime
# =============================================================

DSM_PROVIDER="native"
GAME_BINARY=""
SERVER_CONFIG=""
SERVER_PROFILES=""
SERVER_PORT=""
DSM_PID_FILE="/opt/dsm/runtime/server.pid"
SERVER_LOG="/opt/dsm/logs/server.log"

# =============================================================
# Installation
# =============================================================

INSTALL_DATE=""
INSTALL_LOG="/var/log/dsm-install.log"

# =============================================================
# Services
# =============================================================

SYSTEMD_ENABLED="1"
DASHBOARD_ENABLED="1"
DISCORD_ENABLED="0"

# =============================================================
# GitHub
# =============================================================

GITHUB_BRANCH="main"
GITHUB_REPOSITORY="https://github.com/EzequielRibeiro/Distributed-Server-Manager"

# =============================================================
# Steam defaults
# Game-specific App IDs belong to Catalog/runtime definitions.
# =============================================================

APPID_WORKSHOP=""
APPID_SERVER=""

# =============================================================
# Runtime
# Durable events, alerts and audit history live in the configured database.
# =============================================================

DSM_MOD_RUNTIME="$DSM_RUNTIME/mods"
DSM_INTERVAL="10"
