# =============================================================
# DSM Event Rules
# Commit 10.2
#
# Formato:
# EVENTO=SEVERIDADE
# =============================================================


[SERVER]

SERVER_START=INFO
SERVER_STOP=WARNING
SERVER_RESTART=WARNING
SERVER_CRASH=CRITICAL
SERVER_OFFLINE=CRITICAL


[PLAYER]

PLAYER_JOIN=INFO
PLAYER_LEAVE=INFO
PLAYER_DEATH=INFO
PLAYER_SUICIDE=WARNING


[COMBAT]

PLAYER_KILL=WARNING
PVP_KILL=WARNING
PVE_DEATH=INFO


[MODS]

MOD_UPDATED=INFO
MOD_MISSING=WARNING
MOD_ERROR=CRITICAL
KEY_MISSING=CRITICAL


[SECURITY]

LOGIN=INFO
LOGOUT=INFO
LOGIN_FAILED=WARNING
ACCESS_DENIED=CRITICAL
ADMIN_ACTION=INFO


[BACKUP]

BACKUP_CREATED=INFO
BACKUP_FAILED=CRITICAL


[SYSTEM]

ERROR=CRITICAL
WARNING=WARNING