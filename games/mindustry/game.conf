#!/usr/bin/env bash

# =============================================================
# Capivara Distributed Server Manager
# Mindustry process adapter defaults
# Mindustry Dedicated Server
#
# Exemplo real do provider GitHub Releases.
# O servidor oficial é distribuído como server-release.jar.
# =============================================================

GAME_ID="mindustry"
GAME_NAME="Mindustry Dedicated Server"
GAME_DEFINITION_VERSION="1"
GAME_DEFINITION_TYPE="official"
GAME_SUPPORT_STATUS="example"
GAME_CATEGORY="strategy-sandbox"
GAME_PLATFORM="cross-platform"
GAME_ARCH="any"

# Installation
INSTALL_PROVIDER="github"
INSTALL_PACKAGE_ID="Anuken/Mindustry"
INSTALL_AUTH="anonymous"
INSTALL_DIR="/opt/dsm/game-data/mindustry/serverfiles"
EXECUTABLE="server-release.jar"

# Version model
GAME_VARIANT="dedicated-server"
GAME_VERSION="latest"
GAME_BUILD="release"

# GitHub provider
DSM_GITHUB_TAG="latest"
DSM_GITHUB_ASSET="server-release.jar"
DSM_GITHUB_EXECUTABLE="1"

# Runtime
PROCESS_ENGINE="java"
JAVA_MAIN_JAR="server-release.jar"
JAVA_ARGS="-Xms512M -Xmx2G"
SERVER_ARGS=""
LOG_EXTENSION=".log"
MOD_PREFIX=""
