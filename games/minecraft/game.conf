#!/usr/bin/env bash
# =============================================================
# Minecraft process adapter defaults
# Minecraft
# Model: Game -> Edition -> Variant -> Version -> Build
# =============================================================

GAME_ID="minecraft"
GAME_NAME="Minecraft"
GAME_DEFINITION_VERSION="1"
GAME_DEFINITION_TYPE="official"
GAME_SUPPORT_STATUS="supported"
GAME_CATEGORY="sandbox"
GAME_PLATFORM="cross-platform"
GAME_RUNTIME="java"

GAME_EDITIONS="java bedrock"
GAME_DEFAULT_EDITION="java"
GAME_DEFAULT_VARIANT="vanilla"

# A variant selecionada completa estes valores dinamicamente.
INSTALL_PROVIDER="dynamic"
INSTALL_PACKAGE_ID="dynamic"
INSTALL_AUTH="anonymous"
INSTALL_DIR="/opt/dsm/game-data/minecraft"
EXECUTABLE="server.jar"
PROCESS_ENGINE="java"

JAVA_BIN="java"
JAVA_MEMORY_MIN="4G"
JAVA_MEMORY_MAX="8G"
LOG_DIR="${INSTALL_DIR}/logs"
CONFIG_FILE="server.properties"
SAVE_DIR="${INSTALL_DIR}/world"
MOD_PATH="mods"
MOD_PREFIX=""
