###############################################################################
# DayZ Server Manager
# Dashboard Router
# File: dashboard/api/routes.conf
# Version: 2.0.0
###############################################################################

###############################################################################
# Sintaxe: METHOD URI HANDLER ACTION AUTH MIDDLEWARE
###############################################################################

###############################################################################
# SERVER
###############################################################################
GET     /api/server                  server      status          user    auth
GET     /api/server/info             server      info            user    auth
GET     /api/server/players          server      players         user    auth
GET     /api/server/network          server      network         user    auth
GET     /api/server/performance      server      performance     user    auth
POST    /api/server/start            server      start           admin   auth
POST    /api/server/stop             server      stop            admin   auth
POST    /api/server/restart          server      restart         admin   auth
POST    /api/server/update           server      update          admin   auth

###############################################################################
# MONITOR
###############################################################################
GET     /api/monitor                 monitor     status          user    auth
GET     /api/monitor/history         monitor     history         user    auth
POST    /api/monitor/run             monitor     run             admin   auth
POST    /api/monitor/reset           monitor     reset           admin   auth

###############################################################################
# BACKUP
###############################################################################
GET     /api/backup                  backup      list            user    auth
GET     /api/backup/history          backup      history         user    auth
POST    /api/backup/create           backup      create          admin   auth
POST    /api/backup/restore          backup      restore         admin   auth
DELETE  /api/backup/delete           backup      delete          admin   auth

###############################################################################
# MODS
###############################################################################
GET     /api/mods                    mods        list            user    auth
POST    /api/mods/update             mods        update          admin   auth
POST    /api/mods/install            mods        install         admin   auth
DELETE  /api/mods/remove             mods        remove          admin   auth

###############################################################################
# ALERTS
###############################################################################
GET     /api/alerts                  notifications list         user    auth
GET     /api/alerts/count            notifications count        user    auth
GET     /api/alerts/active           notifications active       user    auth
POST    /api/alerts/ack              notifications acknowledge admin   auth

###############################################################################
# TIMELINE
###############################################################################
GET     /api/timeline                timeline    list           user    auth
GET     /api/timeline/stats          timeline    stats          user    auth

###############################################################################
# DISCORD
###############################################################################
GET     /api/discord/status          discord     status         admin   auth
POST    /api/discord/test            discord     test           admin   auth
POST    /api/discord/send            discord     send           admin   auth

###############################################################################
# AUTH
###############################################################################
POST    /api/login                   auth        login          public  none
POST    /api/logout                  auth        logout         user    auth
GET     /api/whoami                  auth        whoami         user    auth

###############################################################################
# RUNTIME
###############################################################################
GET     /api/runtime                 runtime     dump           admin   auth
GET     /api/runtime/info            runtime     info           admin   auth

###############################################################################
# CATALOG V2
###############################################################################
GET     /api/catalog/runtimes           catalog runtimes           user  auth
GET     /api/catalog/runtime            catalog runtime            user  auth
GET     /api/catalog/content            catalog content            user  auth
GET     /api/catalog/content-definition catalog content-definition user  auth
GET     /api/catalog/providers          catalog providers          user  auth
GET     /api/catalog/installed          catalog installed          user  auth
POST    /api/catalog/compatibility      catalog compatibility      admin auth
POST    /api/catalog/environment-install catalog environment-install admin auth
POST    /api/catalog/plan               catalog plan               admin auth
POST    /api/catalog/install            catalog install            admin auth
POST    /api/catalog/remove             catalog remove             admin auth
POST    /api/catalog/verify             catalog verify             admin auth
POST    /api/catalog/rollback           catalog rollback           admin auth

###############################################################################
# CONFIG
###############################################################################
GET     /api/config                  config      list           admin   auth
POST    /api/config/reload           config      reload         admin   auth
POST    /api/config/set              config      set            admin   auth

###############################################################################
# LOGS
###############################################################################
GET     /api/logs                    logger      list           admin   auth
GET     /api/logs/live               logger      live           admin   auth
GET     /api/logs/download           logger      download       admin   auth

###############################################################################
# SYSTEM
###############################################################################
GET     /api/system                  system      info           admin   auth
GET     /api/system/cpu              system      cpu            admin   auth
GET     /api/system/memory           system      memory         admin   auth
GET     /api/system/disk             system      disk           admin   auth
GET     /api/system/network          system      network        admin   auth

###############################################################################
# HEALTH
###############################################################################
GET     /health                      system      health         public  none
GET     /ping                        system      ping           public  none
