<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha | Capivara DSM</title><link rel="stylesheet" href="/customer-auth.css"></head><body><main class="customer-auth-shell"><section class="customer-auth-card"><p class="eyebrow">CAPIVARA DSM</p><h1>Redefinir senha</h1><p>Defina uma nova senha para sua conta de cliente.</p><form id="customer-reset-form"><input id="customer-reset-token" name="token" type="hidden"><label>Nova senha<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirmar senha<input name="password_confirmation" type="password" autocomplete="new-password" minlength="8" required></label><button type="submit">Salvar nova senha</button></form><p id="customer-reset-message" role="status"></p><nav class="customer-auth-links"><a href="/customer-login.html">Voltar ao login</a></nav></section></main><script src="/customer-auth.js"></script></body></html>
