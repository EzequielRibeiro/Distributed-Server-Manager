<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Consultar clientes | Capivara DSM</title>
  <link rel="stylesheet" href="/dashboard-home-v3.css">
  <link rel="stylesheet" href="/catalog-v2.css">
  <link rel="stylesheet" href="/customer-management.css?v=1">
</head>
<body class="cap-home cap-admin-shell">
<div id="sidebar-component"></div>
<main class="cap-home-main customer-management-page">
  <header class="cap-home-topbar cap-admin-topbar">
    <div class="cap-home-title"><button id="admin-menu-toggle" type="button" aria-label="Recolher menu">☰</button><div><h1>Consultar clientes</h1><p>Localize uma conta usando um único critério por vez.</p></div></div>
    <div class="cap-top-status"><div class="cap-controller-state"><i></i><span>Controller Online</span></div><div class="cap-user"><strong id="admin-user-name">—</strong><span id="admin-user-role">—</span></div></div>
  </header>
  <div class="cap-home-content customer-management-content">
    <section class="card catalog-v2-card customer-management-card">
      <div class="card-title"><div><h2>Busca de cliente</h2><p>Escolha nome, e-mail, documento ou código do cliente.</p></div><div class="customer-navigation"><a href="/customer-create.html">Novo cliente</a><a href="/customer-contract-create.html">Novo contrato</a></div></div>
      <div class="customer-search-row">
        <select id="customer-search-field" aria-label="Critério de busca"><option value="name">Nome</option><option value="email">E-mail</option><option value="document">Documento</option><option value="customer_code">Código do cliente</option></select>
        <input id="customer-search" autocomplete="off" placeholder="Digite o valor da consulta">
        <button id="customer-search-button" class="customer-primary" type="button">Localizar</button>
      </div>
      <div id="customer-search-message" class="customer-notice"></div>
      <div id="customer-results" class="customer-results"></div>
    </section>
  </div>
  <footer class="cap-home-footer">Capivara Distributed Server Manager · Control Plane</footer>
</main>
<script src="/sidebar-v3.js?v=2"></script><script src="/customer-management-shell.js?v=1"></script>
<script src="/customers.js?v=4"></script>
</body>
</html>
