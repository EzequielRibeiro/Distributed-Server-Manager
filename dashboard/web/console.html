<!DOCTYPE html>

<html lang="pt-BR">


<head>

<meta charset="UTF-8">

<title>
DSM Console
</title>


<link rel="stylesheet"
href="style.css">


</head>



<body>


<div class="layout">


<div id="sidebar">

</div>




<main class="content">


<div id="header">

</div>



<section class="panel">


<h2>
⌨ Console DSM
</h2>



<div class="console-info">


Usuário:

<strong id="console-user">
-
</strong>


</div>



<textarea
id="console-output"
readonly>

Aguardando comando...

</textarea>



<div class="console-input">


<input
id="console-command"
placeholder="Digite um comando DSM">


<button id="btn-console-execute">

Executar

</button>


</div>


</section>



</main>


</div>



<script src="console.js"></script>


</body>


</html>
