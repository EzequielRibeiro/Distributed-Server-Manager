<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizações de servidores | Capivara</title><link rel="stylesheet" href="/controller-dashboard.css"></head>
<body><main class="container"><h1>Atualizações de servidores</h1><p>Detecte versões upstream, configure política e execute atualizações seguras por instância.</p>
<section><label>Instância <input id="instance" maxlength="191" autocomplete="off"></label><button id="load" type="button">Consultar</button><button id="check" type="button">Verificar agora</button><button id="update" type="button">Atualizar agora</button></section>
<section><h2>Política</h2><label>Modo <select id="mode"><option value="manual">Manual</option><option value="automatic">Automática</option><option value="maintenance">Janela de manutenção</option></select></label><label>Fuso <input id="timezone" value="America/Sao_Paulo"></label><label>Início <input id="start" type="time" value="04:00"></label><label>Duração (min) <input id="duration" type="number" min="15" max="720" value="60"></label><label>Checagem (s) <input id="interval" type="number" min="900" max="86400" value="3600"></label><label><input id="backup" type="checkbox" checked> Backup antes de atualizar</label><button id="save" type="button">Salvar política</button></section>
<section><h2>Estado</h2><pre id="status">Informe uma instância.</pre></section></main><script src="/browser-auth-client.js"></script><script src="/server-updates.js"></script></body></html>
