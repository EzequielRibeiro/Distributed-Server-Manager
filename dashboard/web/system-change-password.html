<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Definir nova senha | Capivara DSM</title>
  <link rel="stylesheet" href="/dashboard-home-v3.css">
  <link rel="stylesheet" href="/customer-admin.css?v=4">
</head>
<body class="cap-home cap-admin-shell">
<main class="cap-home-main customer-admin-page" style="margin-left:0;max-width:760px;margin-inline:auto">
  <div class="cap-home-content cap-admin-content">
    <section class="card catalog-v2-card cap-admin-card">
      <div class="card-title"><div><h1>Defina sua senha</h1><p>Esta conta foi criada com uma senha temporária. Antes de acessar o Capivara, escolha uma nova senha pessoal.</p></div></div>
      <div class="catalog-v2-form">
        <label>Nova senha<input id="new-password" type="password" minlength="8" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></label>
        <label>Confirmar nova senha<input id="confirm-password" type="password" minlength="8" autocomplete="new-password"></label>
      </div>
      <div class="catalog-v2-actions"><button id="change-password" class="catalog-v2-primary" type="button">Atualizar senha e continuar</button></div>
      <div id="change-message" class="catalog-v2-summary"></div>
    </section>
  </div>
</main>
<script src="/system-change-password.js?v=1"></script>
</body>
</html>
