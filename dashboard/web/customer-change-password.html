<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alterar senha | Capivara DSM</title><link rel="stylesheet" href="/customer-auth.css"></head><body><main class="customer-auth-shell"><section class="customer-auth-card"><p class="eyebrow">CAPIVARA DSM</p><h1>Crie sua senha definitiva</h1><p>A senha usada neste acesso é provisória. Defina uma nova senha para continuar.</p><form id="customer-change-password-form"><label>Nova senha<input id="customer-new-password" name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirmar senha<input id="customer-new-password-confirmation" name="password_confirmation" type="password" minlength="8" autocomplete="new-password" required></label><button type="submit">Salvar nova senha</button></form><p id="customer-change-password-message" role="status"></p></section></main><script src="/customer-change-password.js"></script></body></html>
