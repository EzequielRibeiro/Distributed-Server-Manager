# =============================================================
# DSM Dashboard Worker
# Configuração
# =============================================================
INTERVAL=10
LOG_LEVEL=INFO
# Intervalo principal do worker
WORKER_INTERVAL=10
# Diretórios
DSM_STATE_DIR=/opt/dsm/dashboard/state
DSM_LOG_DIR=/opt/dsm/logs
# Habilitação dos módulos
ENABLE_SERVER=true
ENABLE_METRICS=true
ENABLE_MONITOR=true
ENABLE_ALERTS=true
ENABLE_DOCTOR=true
ENABLE_SCHEDULER=true
ENABLE_DASHBOARD=true
