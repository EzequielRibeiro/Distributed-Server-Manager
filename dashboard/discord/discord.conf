# Capivara DSM - integração Discord genérica (Controller)
#
# O cliente nunca informa tokens ou secrets no Dashboard. O administrador do
# Controller registra um único aplicativo/bot Capivara no Discord Developer
# Portal e mantém os segredos fora do repositório.
#
# Exemplo de variáveis de ambiente:
# DSM_DISCORD_CLIENT_ID=123456789012345678
# DSM_DISCORD_REDIRECT_URI=https://controller.example.com/api/customer/integrations/discord/callback
# DSM_DISCORD_CLIENT_SECRET_FILE=/opt/dsm/secrets/discord-client-secret
# DSM_DISCORD_BOT_TOKEN_FILE=/opt/dsm/secrets/discord-bot-token
#
# Alternativas DSM_DISCORD_CLIENT_SECRET e DSM_DISCORD_BOT_TOKEN são aceitas
# para desenvolvimento, mas arquivos protegidos são recomendados em produção.
#
# O Discord é vinculado ao Customer/Instance, nunca ao tipo de jogo. Um
# Customer pode manter várias guilds, escolher uma padrão e sobrescrever ou
# desabilitar a integração por instância.
