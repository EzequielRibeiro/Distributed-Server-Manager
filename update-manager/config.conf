#!/bin/bash
# =============================================================
# CONFIGURAÇÃO MÓDULO 11
#
# DSM UPDATE MANAGER v1.0.0
#
# Responsável por:
# - GitHub Releases
# - download
# - validação
# - histórico
#
# =============================================================

# =============================================================
# Ambiente DSM
# =============================================================

if [ -z "$DSM_ROOT" ]; then
    DSM_ROOT="/opt/dsm"
fi

# =============================================================
# Identificação do projeto
# =============================================================

PROJECT_NAME="DSM"
PROJECT_VERSION_FILE="$DSM_ROOT/version"

# =============================================================
# GitHub
# =============================================================

GITHUB_OWNER="EzequielRibeiro"
GITHUB_REPO="gerenciador-servidor-dayz"

GITHUB_BRANCH="main"

GITHUB_API="https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/releases/latest"

# =============================================================
# Diretórios
# =============================================================

INSTALL_DIR="$DSM_ROOT"
UPDATE_MANAGER_DIR="$DSM_ROOT/update-manager"
CACHE_DIR="$DSM_ROOT/cache/update"
DOWNLOAD_DIR="$CACHE_DIR/downloads"
EXTRACT_DIR="$CACHE_DIR/extracted"
CHECKSUM_DIR="$CACHE_DIR/checksum"

HISTORY_FILE="$UPDATE_MANAGER_DIR/update-history.log"

# =============================================================
# Canal de atualização
# =============================================================

# stable
# beta
# dev

UPDATE_CHANNEL="stable"

# =============================================================
# Validação
# =============================================================

VERIFY_CHECKSUM=1
VERIFY_SIGNATURE=0

# =============================================================
# Versão mínima suportada
# =============================================================

MIN_VERSION="1.0.0"

# =============================================================
# Rede
# =============================================================

GITHUB_TIMEOUT=30
DOWNLOAD_TIMEOUT=120

# =============================================================
# Pacotes
# =============================================================

RELEASE_PATTERN="DSM-*.tar.gz"

# =============================================================
# Limpeza
# =============================================================

KEEP_RELEASES=3

AUTO_CLEANUP_CACHE=1
